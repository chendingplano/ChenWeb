<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Metric Ontology Explorer — Workbench (Prototype A)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<style>
  :root {
    --bg: #070a0e;
    --panel: #0d1218;
    --panel-2: #10161d;
    --line: #1c2732;
    --line-bright: #2b3947;
    --ink: #cdd8e3;
    --ink-dim: #8090a0;
    --ink-faint: #566472;
    --cyan: #35d6e6;
    --cyan-deep: #0f8f9c;
    --amber: #f6b64b;
    --violet: #9d8bff;
    --green: #5fd08a;
    --red: #f2617a;
    --radius: 3px;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    --display: "Chakra Petch", var(--sans);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  ::selection { background: rgba(53, 214, 230, 0.28); }

  /* ---------- App shell ---------- */
  .app { display: flex; flex-direction: column; height: 100vh; }

  .topbar {
    display: flex; align-items: center; gap: 18px;
    height: 46px; padding: 0 14px;
    background: linear-gradient(180deg, #0f151c, #0b0f14);
    border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
    position: relative; z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .mark {
    width: 22px; height: 22px; border-radius: 4px;
    background:
      radial-gradient(circle at 30% 30%, var(--cyan), transparent 60%),
      radial-gradient(circle at 72% 74%, var(--amber), transparent 58%),
      #0a1015;
    border: 1px solid var(--line-bright);
    box-shadow: 0 0 14px rgba(53, 214, 230, 0.18);
  }
  .brand .title {
    font-family: var(--display);
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-size: 12.5px;
    color: #eaf2f8;
  }
  .crumb {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
  }
  .crumb b { color: var(--ink-dim); font-weight: 500; }
  .topbar .spacer { flex: 1; }

  .seg {
    display: inline-flex; align-items: stretch;
    border: 1px solid var(--line-bright);
    border-radius: var(--radius);
    overflow: hidden;
    background: #0a0f14;
  }
  .seg button {
    appearance: none; border: 0; background: transparent;
    color: var(--ink-dim);
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 6px 11px; cursor: pointer;
    display: flex; align-items: center; gap: 7px;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button svg { width: 13px; height: 13px; }
  .seg button.active { background: rgba(53, 214, 230, 0.12); color: var(--cyan); }
  .seg button:hover:not(.active) { color: var(--ink); background: rgba(255,255,255,0.03); }

  .txt-btn {
    appearance: none; background: transparent; border: 0;
    color: var(--ink-faint);
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em;
    text-transform: uppercase; cursor: pointer; padding: 6px 4px;
  }
  .txt-btn:hover { color: var(--cyan); }

  /* ---------- Workspace / panes ---------- */
  #workspace { flex: 1 1 auto; display: flex; min-height: 0; min-width: 0; }
  .group { display: flex; min-width: 0; min-height: 0; }
  .group.vert { flex-direction: column; }
  .group.horz { flex-direction: row; }

  .pane {
    background: var(--panel);
    min-width: 0; min-height: 0;
    display: flex; flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  .pane-head {
    display: flex; align-items: center; gap: 10px;
    height: 30px; padding: 0 10px;
    border-bottom: 1px solid var(--line);
    background: var(--panel-2);
    flex: 0 0 auto;
  }
  .pane-head .lbl {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--ink-faint);
  }
  .pane-head .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan-deep); }
  .pane-head .grow { flex: 1; }
  .pane-body { flex: 1 1 auto; min-height: 0; position: relative; }

  .splitter {
    flex: 0 0 6px; background: var(--bg);
    position: relative; z-index: 5;
  }
  .splitter::after {
    content: ""; position: absolute; inset: 0;
    background: var(--line);
    transition: background 0.12s;
  }
  .splitter[data-axis="x"] { cursor: col-resize; }
  .splitter[data-axis="y"] { cursor: row-resize; }
  .splitter:hover::after, .splitter.drag::after { background: var(--cyan); }
  .splitter[data-axis="x"]::before,
  .splitter[data-axis="y"]::before {
    content: ""; position: absolute; z-index: 1;
  }
  .splitter[data-axis="x"]::before { inset: 0 -4px; }
  .splitter[data-axis="y"]::before { inset: -4px 0; }
  body.resizing { cursor: inherit; user-select: none; }
  body.resizing iframe { pointer-events: none; }

  /* ---------- Canvas ---------- */
  #canvasHost { position: absolute; inset: 0; }
  #graph { width: 100%; height: 100%; display: block; cursor: grab; }
  #graph.grabbing { cursor: grabbing; }

  .link { stroke: var(--line-bright); stroke-width: 1.2px; }
  .link.dim { stroke: #161f28; }
  .link.hot { stroke: var(--cyan); stroke-width: 1.6px; }
  .link-label {
    font-family: var(--mono); font-size: 9px; fill: var(--ink-faint);
    letter-spacing: 0.04em; pointer-events: none; opacity: 0;
    transition: opacity 0.15s;
  }
  .link-label.show { opacity: 1; }

  .node { cursor: pointer; }
  .node .chip {
    fill: #121a22; stroke: var(--line-bright); stroke-width: 1px;
    rx: 4;
  }
  .node.sat .chip { fill: #10171e; }
  .node.center .chip { fill: #0e1b1e; stroke: var(--cyan-deep); stroke-width: 1.4px; }
  .node.selected .chip { stroke: var(--cyan); stroke-width: 1.6px; filter: url(#glow); }
  .node.flash .chip { stroke: var(--amber); stroke-width: 2px; }
  .node.dim { opacity: 0.32; }
  .node .lbl {
    font-family: var(--mono); font-size: 11px; fill: var(--ink);
    dominant-baseline: middle;
  }
  .node.center .lbl { fill: #eaf7f9; font-weight: 600; }
  .node .kind {
    font-family: var(--mono); font-size: 8px; fill: var(--ink-faint);
    letter-spacing: 0.12em; text-transform: uppercase; dominant-baseline: middle;
  }
  .node .glyph { fill: none; stroke: var(--cyan); stroke-width: 1.3px; }
  .node.sat .glyph { stroke: var(--ink-dim); }
  .node.expanded .glyph { stroke: var(--amber); }
  .node .pin {
    fill: var(--amber); opacity: 0;
  }
  .node.pinned .pin { opacity: 1; }
  .node.n2 .chip { fill: #0c1116; stroke: var(--line); stroke-dasharray: 2 2; }
  .node.n2 .lbl { fill: var(--ink-dim); font-size: 10px; }

  .canvas-tools {
    position: absolute; top: 10px; left: 10px;
    display: flex; gap: 6px; z-index: 6;
  }
  .canvas-tools button {
    width: 26px; height: 26px; padding: 0;
    background: rgba(13, 18, 24, 0.9); border: 1px solid var(--line-bright);
    border-radius: var(--radius); color: var(--ink-dim);
    font-family: var(--mono); font-size: 13px; cursor: pointer;
    display: grid; place-items: center;
  }
  .canvas-tools button:hover { color: var(--cyan); border-color: var(--cyan-deep); }

  .legend {
    position: absolute; bottom: 10px; left: 10px; z-index: 6;
    background: rgba(10, 15, 20, 0.82);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 7px 9px;
    font-family: var(--mono); font-size: 9px; color: var(--ink-faint);
    letter-spacing: 0.04em; line-height: 1.65;
    max-width: 168px; pointer-events: none;
  }
  .legend b { color: var(--ink-dim); font-weight: 500; }
  #canvasHost.short .legend, #canvasHost.short #minimap { display: none; }

  #minimap {
    position: absolute; right: 10px; bottom: 10px; z-index: 6;
    width: 150px; height: 96px;
    background: rgba(8, 12, 16, 0.92);
    border: 1px solid var(--line-bright);
    border-radius: var(--radius);
    overflow: hidden; cursor: crosshair;
  }
  #minimap .mm-node { fill: var(--ink-faint); }
  #minimap .mm-node.center { fill: var(--cyan); }
  #minimap .mm-node.selected { fill: var(--amber); }
  #minimap .mm-view { fill: rgba(53, 214, 230, 0.1); stroke: var(--cyan); stroke-width: 1px; }

  /* ---------- Tabbed content viewer ---------- */
  .tabs-strip {
    display: flex; align-items: stretch; gap: 0;
    border-bottom: 1px solid var(--line);
    background: var(--panel-2);
    flex: 0 0 auto;
    overflow-x: auto;
  }
  .tabs-strip button {
    appearance: none; background: transparent; border: 0;
    border-bottom: 2px solid transparent;
    color: var(--ink-faint);
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.09em;
    text-transform: uppercase;
    padding: 8px 13px; cursor: pointer; white-space: nowrap;
  }
  .tabs-strip button:hover { color: var(--ink); }
  .tabs-strip button.active { color: var(--cyan); border-bottom-color: var(--cyan); }

  .tab-body { flex: 1 1 auto; overflow: auto; padding: 16px 18px; }
  .tab-body::-webkit-scrollbar, .pane-body ::-webkit-scrollbar,
  .pdf-scroll::-webkit-scrollbar { width: 10px; height: 10px; }
  .tab-body::-webkit-scrollbar-thumb, .pdf-scroll::-webkit-scrollbar-thumb {
    background: var(--line-bright); border-radius: 10px;
  }

  .node-title {
    font-family: var(--display); font-weight: 700;
    font-size: 19px; letter-spacing: 0.02em;
    color: #eef4f9; margin: 0 0 3px;
  }
  .node-sub {
    font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint);
    letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 14px;
  }
  .prose { color: var(--ink); line-height: 1.62; font-size: 12.5px; max-width: 62ch; }
  .prose p { margin: 0 0 11px; }
  .prose .k { color: var(--cyan); font-family: var(--mono); font-size: 11.5px; }

  table.kv { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.kv td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.kv td.k {
    font-family: var(--mono); color: var(--ink-dim); width: 38%;
    letter-spacing: 0.03em; font-size: 11px;
  }
  table.kv td.v { color: var(--ink); font-family: var(--mono); font-size: 11.5px; }

  table.rec { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  table.rec th {
    text-align: left; font-family: var(--mono); font-size: 9.5px;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint);
    padding: 7px 8px; border-bottom: 1px solid var(--line-bright);
  }
  table.rec td { padding: 7px 8px; border-bottom: 1px solid var(--line); font-family: var(--mono); }
  table.rec tr:hover td { background: rgba(255,255,255,0.02); }
  .pill {
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.06em;
    padding: 2px 6px; border-radius: 2px; text-transform: uppercase;
    border: 1px solid currentColor;
  }
  .pill.ok { color: var(--green); }
  .pill.warn { color: var(--amber); }
  .pill.err { color: var(--red); }

  pre.raw {
    margin: 0; font-family: var(--mono); font-size: 11px; line-height: 1.6;
    color: var(--ink); background: #0a0e12; border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px; overflow: auto;
  }
  pre.raw .j-key { color: var(--cyan); }
  pre.raw .j-str { color: var(--amber); }
  pre.raw .j-num { color: var(--violet); }
  pre.raw .j-bool { color: var(--green); }

  .ev-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 10.5px; color: var(--cyan);
    cursor: pointer; margin-top: 4px;
  }
  .ev-link:hover { text-decoration: underline; }

  /* ---------- PDF viewer ---------- */
  .pdf-toolbar {
    display: flex; align-items: center; gap: 10px;
    height: 30px; padding: 0 10px;
    background: var(--panel-2); border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }
  .pdf-toolbar .lbl {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--ink-faint);
  }
  .pdf-toolbar .grow { flex: 1; }
  .pdf-toolbar button {
    width: 22px; height: 22px; padding: 0;
    background: #0a0f14; border: 1px solid var(--line-bright);
    color: var(--ink-dim); border-radius: 2px; cursor: pointer;
    font-family: var(--mono); font-size: 12px;
  }
  .pdf-toolbar button:hover { color: var(--cyan); }
  .pdf-toolbar .zoom {
    font-family: var(--mono); font-size: 10px; color: var(--ink-dim);
    min-width: 38px; text-align: center;
  }
  .pdf-hint {
    font-family: var(--mono); font-size: 10px; color: var(--amber);
    letter-spacing: 0.04em;
  }

  .pdf-scroll {
    flex: 1 1 auto; overflow: auto; padding: 18px;
    background:
      repeating-linear-gradient(45deg, #080b0f 0 10px, #090c10 10px 20px);
  }
  .pdf-doc {
    transform-origin: top center;
    margin: 0 auto;
    width: 520px;
  }
  .pdf-page {
    background: #0c1116;
    border: 1px solid var(--line-bright);
    box-shadow: 0 18px 40px rgba(0,0,0,0.5);
    padding: 42px 46px;
    margin-bottom: 20px;
    font-family: "IBM Plex Serif", Georgia, serif;
    color: #b9c6d2;
    line-height: 1.7;
    font-size: 12px;
  }
  .pdf-page h2 {
    font-family: var(--display); font-size: 13px; letter-spacing: 0.08em;
    text-transform: uppercase; color: #dfe9f1; margin: 0 0 4px;
  }
  .pdf-page .clause-no {
    font-family: var(--mono); font-size: 10px; color: var(--ink-faint);
  }
  .pdf-page p { margin: 0 0 12px; }
  .pdf-page mark {
    background: transparent; color: inherit;
    border-bottom: 1px dashed var(--line-bright);
    padding: 0 1px; cursor: pointer;
  }
  .pdf-page mark.is-active {
    background: rgba(246, 182, 75, 0.16);
    border-bottom: 1px solid var(--amber);
    color: #f4e6cd;
  }
  .pdf-page mark.flash {
    background: rgba(53, 214, 230, 0.22);
  }
  .pg-foot {
    font-family: var(--mono); font-size: 9px; color: var(--ink-faint);
    text-align: center; letter-spacing: 0.1em;
  }

  .empty {
    height: 100%; display: grid; place-items: center;
    color: var(--ink-faint); font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <div class="mark"></div>
      <div class="title">Metric Ontology Explorer</div>
    </div>
    <div class="crumb">home3 / <b>knowledge</b> / ontology / <b>metric</b></div>
    <div class="spacer"></div>
    <div class="seg" id="layoutSeg">
      <button data-layout="lr" class="active" title="Left / Right">
        <svg viewBox="0 0 16 16"><rect x="1" y="1" width="7" height="14" fill="none" stroke="currentColor"/><rect x="9.5" y="1" width="5.5" height="6" fill="none" stroke="currentColor"/><rect x="9.5" y="9" width="5.5" height="6" fill="none" stroke="currentColor"/></svg>
        L·R
      </button>
      <button data-layout="tb" title="Top / Bottom">
        <svg viewBox="0 0 16 16"><rect x="1" y="1" width="14" height="7" fill="none" stroke="currentColor"/><rect x="1" y="9.5" width="6" height="5.5" fill="none" stroke="currentColor"/><rect x="9" y="9.5" width="6" height="5.5" fill="none" stroke="currentColor"/></svg>
        T·B
      </button>
    </div>
    <button class="txt-btn" id="resetLayout">reset panes</button>
    <button class="txt-btn" id="reheat">re-layout graph</button>
  </header>

  <div id="workspace"></div>
</div>

<!-- ===== Detachable panes (moved into layout scaffold by JS) ===== -->
<template id="paneTemplates">
  <section class="pane" id="paneCanvas">
    <div class="pane-head"><span class="dot"></span><span class="lbl">Canvas · Ontology Graph</span><span class="grow"></span><span class="lbl" id="canvasMeta"></span></div>
    <div class="pane-body">
      <div id="canvasHost">
        <svg id="graph"></svg>
        <div class="canvas-tools">
          <button data-z="in" title="Zoom in">+</button>
          <button data-z="out" title="Zoom out">−</button>
          <button data-z="fit" title="Fit">⤢</button>
        </div>
        <div class="legend">
          <div><b>click</b> node → load panels</div>
          <div><b>click</b> satellite → expand hop</div>
          <div><b>drag</b> node → pin · <b>dbl‑click</b> → release</div>
          <div><b>wheel</b> → zoom · <b>drag bg</b> → pan</div>
        </div>
        <svg id="minimap"></svg>
      </div>
    </div>
  </section>

  <section class="pane" id="paneTabs">
    <div class="pane-head"><span class="dot"></span><span class="lbl">Content Viewer</span><span class="grow"></span><span class="lbl" id="tabsMeta"></span></div>
    <div class="tabs-strip" id="tabsStrip"></div>
    <div class="tab-body" id="tabBody"></div>
  </section>

  <section class="pane" id="panePdf">
    <div class="pdf-toolbar">
      <span class="lbl">Source Document</span>
      <span class="pdf-hint" id="pdfHint"></span>
      <span class="grow"></span>
      <button data-pz="out">−</button>
      <span class="zoom" id="pdfZoom">100%</span>
      <button data-pz="in">+</button>
      <button data-pz="fit">⤢</button>
    </div>
    <div class="pdf-scroll" id="pdfScroll">
      <div class="pdf-doc" id="pdfDoc"></div>
    </div>
  </section>
</template>

<script>
/* =====================================================================
   Metric Ontology Explorer — Prototype A "Workbench"
   Standalone. D3 force-directed ego graph + expandable hops + minimap.
   ===================================================================== */

const LS_KEY = "moe-proto-A-v1";

/* ---------- Mock ontology dataset ---------- */
const CENTER = {
  id: "metric", label: "Metric", kind: "core",
  blurb: "A measurable indicator mined from a document — a value, threshold, target, rate, score or KPI — normalized into kb.metrics.",
  attributes: {
    table: "kb.metrics",
    identity: "metric_key (doc + clause + slug)",
    value_range_type: "309-string free-text vocabulary",
    unit: "governed by Metric Definition",
    lifecycle: "extracted → enriched → Phase D semantic write",
  },
  records: [
    ["mtr_0912", "U-factor, opaque wall assembly", "TPS-118 §4.2", "ok"],
    ["mtr_0913", "Air leakage rate @75Pa", "TPS-118 §6.1", "warn"],
    ["mtr_0914", "Continuous insulation R-value", "TPS-118 §4.4", "ok"],
    ["mtr_0915", "Thermal bridging penalty", "TPS-118 §5.3", "err"],
  ],
  stats: { count: "18,204", coverage: "82%", lastRun: "2026-09-04 18:41" },
  evidence: [],
};

const SATS = [
  {
    id: "document", label: "Document", kind: "source", edge: "mined from",
    blurb: "Source PDFs and their line-based extracts. Every Metric traces to a document offset.",
    attributes: { table: "kb.inputs", grain: "chunk / clause", parser: "layout-aware", id_field: "record_id → kb.inputs.id" },
    records: [["doc_TPS118", "Thermal Performance Standard TPS-118", "42 pages · 214 chunks", "ok"], ["doc_TPS118_x", "TPS-118 extract (line-based)", "1,904 lines", "ok"]],
    stats: { count: "1,336", coverage: "100%", lastRun: "2026-09-01 09:12" },
    evidence: [{ span: "e1", page: 1 }, { span: "e2", page: 1 }],
    neighbors: [["chunk", "Chunk"], ["input", "Input Record"], ["layout", "Layout Block"]],
  },
  {
    id: "object", label: "Object", kind: "entity", edge: "measures",
    blurb: "The real-world thing a Metric measures: a product, material, process or entity. Anchors missing-metric detection.",
    attributes: { table: "kb.semantic_decision_candidates", route: "normalize_assertions", anchor: "object-anchored diagnostics" },
    records: [["obj_wall_op", "Opaque wall assembly", "12 metrics", "ok"], ["obj_fenestr", "Fenestration unit", "5 metrics", "warn"]],
    stats: { count: "2,741", coverage: "69%", lastRun: "2026-09-03 22:05" },
    evidence: [{ span: "e3", page: 2 }],
    neighbors: [["assertion", "Assertion"], ["candidate", "Decision Candidate"]],
  },
  {
    id: "keyword", label: "Keyword", kind: "lexicon", edge: "tagged by",
    blurb: "Lexicon terms that surface and classify a Metric. 4,213 verified terms drive aligns_to_term stubs.",
    attributes: { lexicon: "keyword lexicon v2", verified_terms: "4,213", qudt_linked: "4,213", match: "surface + morphological" },
    records: [["kw_ufactor", "u-factor", "syn: thermal transmittance", "ok"], ["kw_airleak", "air leakage", "syn: infiltration", "ok"]],

/* ---------- Layout engine (re-parenting scaffold) ---------- */
const workspace = document.getElementById("workspace");
const tpl = document.getElementById("paneTemplates").content;
const paneCanvas = tpl.getElementById("paneCanvas");
const paneTabs = tpl.getElementById("paneTabs");
const panePdf = tpl.getElementById("panePdf");

const DEFAULTS = { layout: "lr", leftW: 520, canvasH: 360, tabsW: 380 };
let state = loadState();

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if (s && s.layout) return Object.assign({}, DEFAULTS, s);
  } catch (e) {}
  return Object.assign({}, DEFAULTS);
}
function saveState() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
}

function buildLayout() {
  workspace.textContent = "";
  workspace.style.flexDirection = state.layout === "lr" ? "row" : "column";

  if (state.layout === "lr") {
    const left = groupEl("vert");
    left.style.width = state.leftW + "px";
    left.style.flex = "0 0 " + state.leftW + "px";
    paneCanvas.style.flex = "0 0 " + state.canvasH + "px";
    paneCanvas.style.height = state.canvasH + "px";
    paneTabs.style.flex = "1 1 auto";
    left.append(paneCanvas, splitterEl("y", "canvasH"), paneTabs);
    panePdf.style.flex = "1 1 auto";
    workspace.append(left, splitterEl("x", "leftW"), panePdf);
  } else {
    paneCanvas.style.flex = "0 0 " + state.canvasH + "px";
    paneCanvas.style.height = state.canvasH + "px";
    paneCanvas.style.width = "auto";
    const bottom = groupEl("horz");
    bottom.style.flex = "1 1 auto";
    paneTabs.style.flex = "0 0 " + state.tabsW + "px";
    paneTabs.style.width = state.tabsW + "px";
    panePdf.style.flex = "1 1 auto";
    bottom.append(paneTabs, splitterEl("x", "tabsW"), panePdf);
    workspace.append(paneCanvas, splitterEl("y", "canvasH"), bottom);
  }
  requestAnimationFrame(() => { fitGraph(); drawMinimap(); });
  setTimeout(() => { fitGraph(); drawMinimap(); }, 280);
}

function groupEl(kind) {
  const d = document.createElement("div");
  d.className = "group " + kind;
  return d;
}
function splitterEl(axis, key) {
  const s = document.createElement("div");
  s.className = "splitter";
  s.dataset.axis = axis;
  s.dataset.key = key;
  s.addEventListener("pointerdown", startResize);
  return s;
}

let resize = null;
function startResize(e) {
  const s = e.currentTarget;
  const key = s.dataset.key;
  const axis = s.dataset.axis;
  resize = { key, axis, startX: e.clientX, startY: e.clientY, startVal: state[key] };
  s.classList.add("drag");
  s.setPointerCapture(e.pointerId);
  document.body.classList.add("resizing");
  s.addEventListener("pointermove", moveResize);
  s.addEventListener("pointerup", endResize);
}
function moveResize(e) {
  if (!resize) return;
  const dx = e.clientX - resize.startX;
  const dy = e.clientY - resize.startY;
  let v = resize.startVal;
  if (resize.key === "leftW") v = clamp(resize.startVal + dx, 300, workspace.clientWidth - 320);
  else if (resize.key === "tabsW") v = clamp(resize.startVal + dx, 260, workspace.clientWidth - 320);
  else if (resize.key === "canvasH") {
    const max = (state.layout === "lr" ? document.querySelector(".group.vert").clientHeight : workspace.clientHeight) - 160;
    v = clamp(resize.startVal + dy, 160, max);
  }
  state[resize.key] = Math.round(v);
  applySizes();
}
function endResize(e) {
  const s = e.currentTarget;
  s.classList.remove("drag");
  s.removeEventListener("pointermove", moveResize);
  s.removeEventListener("pointerup", endResize);
  document.body.classList.remove("resizing");
  resize = null;
  saveState();
  fitGraph(); drawMinimap();
}
function applySizes() {
  if (state.layout === "lr") {
    const left = document.querySelector(".group.vert");
    if (left) { left.style.width = state.leftW + "px"; left.style.flex = "0 0 " + state.leftW + "px"; }
  } else {
    paneTabs.style.flex = "0 0 " + state.tabsW + "px";
    paneTabs.style.width = state.tabsW + "px";
  }
  paneCanvas.style.flex = "0 0 " + state.canvasH + "px";
  paneCanvas.style.height = state.canvasH + "px";
  resizeGraph();
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* layout toggle */
document.getElementById("layoutSeg").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  state.layout = b.dataset.layout;
  [...document.querySelectorAll("#layoutSeg button")].forEach(x => x.classList.toggle("active", x === b));
  saveState();
  buildLayout();
});
document.getElementById("resetLayout").addEventListener("click", () => {
  const layout = state.layout;
  state = Object.assign({}, DEFAULTS, { layout });
  saveState(); buildLayout();
});

/* graph model */
let nodes = [], links = [], expanded = new Set(), selectedId = null;

function baseGraph() {
  nodes = [
    Object.assign({ fx: 0, fy: 0, r: 34 }, CENTER, { _t: "center" }),
    ...SATS.map((s, i) => {
      const a = (i / SATS.length) * Math.PI * 2 - Math.PI / 2;
      return Object.assign({ x: Math.cos(a) * 230, y: Math.sin(a) * 230, r: 24 }, s, { _t: "sat" });
    }),
  ];
  links = SATS.map(s => ({ source: "metric", target: s.id, label: s.edge }));
}
baseGraph();

const sim = d3.forceSimulation(nodes)
  .alphaDecay(0.045)
  .force("link", d3.forceLink(links).id(d => d.id).distance(l => (l._hop ? 96 : 176)).strength(0.65))
  .force("charge", d3.forceManyBody().strength(d => (d._t === "center" ? -60 : d._t === "n2" ? -220 : -520)))
  .force("collide", d3.forceCollide().radius(d => d.r + 26))
  .force("radial", d3.forceRadial(d => (d._t === "sat" ? 230 : d._t === "n2" ? 340 : 0), 0, 0).strength(d => (d._t === "sat" ? 0.28 : d._t === "n2" ? 0.12 : 0)))
  .force("x", d3.forceX(0).strength(0.02))
  .force("y", d3.forceY(0).strength(0.02))
  .on("tick", ticked);

const drag = d3.drag()
  .on("start", (e, d) => { d._moved = false; })
  .on("drag", (e, d) => {
    if (!d._moved) { d._moved = true; if (!e.active) sim.alphaTarget(0.3).restart(); }
    d.fx = e.x; d.fy = e.y;
  })
  .on("end", (e, d) => {
    if (!d._moved) return;                 // a plain click: no pin, no reheat
    if (!e.active) sim.alphaTarget(0);
    if (d._t !== "center") d.pinned = true; // pin only after an actual drag
    render();
  });

function render() {
  /* links */
  const lk = gLinks.selectAll("line").data(links, d => keyOf(d));
  lk.exit().remove();
  lk.enter().append("line").attr("class", "link").attr("marker-end", "url(#arrow)").merge(lk)
    .classed("hot", d => selectedId && (idOf(d.source) === selectedId || idOf(d.target) === selectedId))
    .classed("dim", d => selectedId && !(idOf(d.source) === selectedId || idOf(d.target) === selectedId));

  const ll = gLinkLabels.selectAll("text").data(links, d => keyOf(d));
  ll.exit().remove();
  ll.enter().append("text").attr("class", "link-label").merge(ll)
    .text(d => d.label || "")
    .classed("show", d => selectedId && (idOf(d.source) === selectedId || idOf(d.target) === selectedId));

  /* nodes */
  const nd = gNodes.selectAll("g.node").data(nodes, d => d.id);
  nd.exit().remove();
  const ent = nd.enter().append("g")
    .attr("class", d => "node " + (d._t === "center" ? "center" : d._t === "n2" ? "n2" : "sat"))
    .call(drag)
    .on("click", (e, d) => { e.stopPropagation(); onNodeClick(d); })
    .on("dblclick", (e, d) => { e.stopPropagation(); if (d._t !== "center") { d.pinned = false; d.fx = null; d.fy = null; sim.alphaTarget(0.3).restart(); setTimeout(() => sim.alphaTarget(0), 400); render(); } })
    .on("mouseenter", (e, d) => highlightLinks(d.id, true))
    .on("mouseleave", () => highlightLinks(null, false));

  ent.each(function (d) {
    const g = d3.select(this);
    const w = labelWidth(d.label, d._t) , h = d._t === "center" ? 46 : d._t === "n2" ? 30 : 38;
    g.append("rect").attr("class", "chip").attr("x", -w / 2).attr("y", -h / 2).attr("width", w).attr("height", h).attr("rx", 5);
    if (d._t !== "n2") {
      g.append("path").attr("class", "glyph").attr("transform", `translate(${-w / 2 + 13}, 0)`).attr("d", glyphPath(d));
      g.append("text").attr("class", "kind").attr("x", -w / 2 + 26).attr("y", d._t === "center" ? -8 : -7).text((d.kind || "").toUpperCase());
      g.append("text").attr("class", "lbl").attr("x", -w / 2 + 26).attr("y", d._t === "center" ? 8 : 6).text(d.label);
    } else {
      g.append("text").attr("class", "lbl").attr("x", 0).attr("y", 0).attr("text-anchor", "middle").text(d.label);
    }
    g.append("circle").attr("class", "pin").attr("cx", w / 2 - 7).attr("cy", -h / 2 + 7).attr("r", 3);
  });

  gNodes.selectAll("g.node")
    .classed("selected", d => d.id === selectedId)
    .classed("expanded", d => expanded.has(d.id))
    .classed("pinned", d => !!d.pinned)
    .classed("dim", d => selectedId && d.id !== selectedId && !isNeighbor(d.id, selectedId));

  sim.nodes(nodes);
  sim.force("link").links(links);
}

function ticked() {
  gLinks.selectAll("line")
    .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  gLinkLabels.selectAll("text")
    .attr("x", d => (d.source.x + d.target.x) / 2)
    .attr("y", d => (d.source.y + d.target.y) / 2 - 4);
  gNodes.selectAll("g.node").attr("transform", d => `translate(${d.x},${d.y})`);
  drawMinimap();
}

function onNodeClick(d) {
  selectNode(d.id);
  if (d._t === "sat") toggleExpand(d);
}

function toggleExpand(d) {
  if (expanded.has(d.id)) {
    expanded.delete(d.id);
    const kill = new Set((d.neighbors || []).map(n => d.id + "::" + n[0]));
    nodes = nodes.filter(n => !kill.has(n.id));
    links = links.filter(l => !kill.has(idOf(l.source)) && !kill.has(idOf(l.target)));
  } else {
    expanded.add(d.id);
    (d.neighbors || []).forEach((n, i) => {
      const nid = d.id + "::" + n[0];
      if (BY_ID[nid]) return;
      const ang = Math.atan2(d.y, d.x) + (i - (d.neighbors.length - 1) / 2) * 0.5;
      const nn = { id: nid, label: n[1], _t: "n2", kind: "", r: 16, x: d.x + Math.cos(ang) * 90, y: d.y + Math.sin(ang) * 90 };
      BY_ID[nid] = nn;
      nodes.push(nn);
      links.push({ source: d.id, target: nid, label: "", _hop: true });
    });
  }
  render();
  sim.alpha(0.7).restart();
  updateCanvasMeta();
}

function selectNode(id) {
  selectedId = id;
  render();
  renderContent(id);
  renderEvidence(id);
  drawMinimap();
}

svg.on("click", () => { /* click background: keep selection, just deselect highlight? keep as is */ });

function highlightLinks(id, on) {
  gLinkLabels.selectAll("text").classed("show", d => on && (idOf(d.source) === id || idOf(d.target) === id));
}
function isNeighbor(a, b) {
  if (!b) return true;
  return links.some(l => (idOf(l.source) === a && idOf(l.target) === b) || (idOf(l.source) === b && idOf(l.target) === a));
}
const idOf = x => (typeof x === "object" ? x.id : x);
const keyOf = l => idOf(l.source) + "→" + idOf(l.target);

function labelWidth(label, t) {
  const base = t === "center" ? 42 : t === "n2" ? 20 : 40;
  return base + label.length * (t === "n2" ? 6.5 : 7.6);
}
function glyphPath(d) {
  // tiny distinct marks per kind
  const m = {
    center: "M -6 0 A 6 6 0 1 0 6 0 A 6 6 0 1 0 -6 0 M 0 -6 L 0 6 M -6 0 L 6 0",
    source: "M -5 -6 L 5 -6 L 5 6 L -5 6 Z M -5 -2 L 5 -2",
    entity: "M 0 -6 L 6 0 L 0 6 L -6 0 Z",
    lexicon: "M -6 4 L -1 -6 L 4 4 M -4 0 L 2 0",
    provenance: "M -6 0 L 6 0 M -3 -4 L -6 0 L -3 4 M 3 -4 L 6 0 L 3 4",
    governed: "M -5 -5 L 5 -5 L 5 5 L -5 5 Z M -2 -5 L -2 5 M 2 -5 L 2 5",
    pipeline: "M -6 -4 L 2 -4 L 2 -7 L 6 0 L 2 7 L 2 4 L -6 4 Z",
    downstream: "M -6 0 L 6 0 L 2 -4 M 6 0 L 2 4",
    diagnostic: "M -6 4 L -2 4 L -2 -2 L 2 -2 L 2 2 L 6 2 L 6 6",
    deferred: "M 0 -6 L 6 6 L -6 6 Z M 0 -2 L 0 2",
  };
  return m[d.kind] || "M -5 0 L 5 0";
}

function updateCanvasMeta() {
  const el = document.getElementById("canvasMeta");
  if (el) el.textContent = `${nodes.length} nodes · ${links.length} edges · ${expanded.size} expanded`;
}

function resizeGraph() {
  const host = document.getElementById("canvasHost");
  if (!host) return;
  const w = host.clientWidth, h = host.clientHeight;
  svg.attr("width", w).attr("height", h).attr("viewBox", `0 0 ${w} ${h}`);
  host.classList.toggle("short", h < 230);
}
function fitGraph() {
  resizeGraph();
  const host = document.getElementById("canvasHost");
  if (!host || !nodes.length) return;
  const w = host.clientWidth, h = host.clientHeight;
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const padX = 66, padY = 46;
  const bw = (maxX - minX) + padX * 2, bh = (maxY - minY) + padY * 2;
  const k = clamp(Math.min(w / bw, h / bh), 0.2, 2.2);
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  const t = d3.zoomIdentity.translate(w / 2 - cx * k, h / 2 - cy * k).scale(k);
  svg.transition().duration(360).call(zoom.transform, t);
}
let firstSettle = true;
sim.on("end", () => { if (firstSettle) { firstSettle = false; fitGraph(); } });

/* ---------- Minimap ---------- */
const mm = d3.select(paneCanvas.querySelector("#minimap"));
function drawMinimap() {
  const el = document.getElementById("minimap");
  if (!el || !nodes.length) return;
  const W = el.clientWidth, H = el.clientHeight;
  mm.attr("viewBox", `0 0 ${W} ${H}`);
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  let minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const padW = (maxX - minX || 1) * 0.15, padH = (maxY - minY || 1) * 0.15;
  minX -= padW; maxX += padW; minY -= padH; maxY += padH;
  const sx = W / (maxX - minX), sy = H / (maxY - minY);
  const s = Math.min(sx, sy);
  const ox = (W - (maxX - minX) * s) / 2, oy = (H - (maxY - minY) * s) / 2;
  const px = x => (x - minX) * s + ox, py = y => (y - minY) * s + oy;

  mm.selectAll("*").remove();
  mm.selectAll("circle.mm-node").data(nodes).enter().append("circle")
    .attr("class", d => "mm-node" + (d._t === "center" ? " center" : d.id === selectedId ? " selected" : ""))
    .attr("cx", d => px(d.x)).attr("cy", d => py(d.y)).attr("r", d => d._t === "center" ? 3 : 2);

  const host = document.getElementById("canvasHost");
  if (host) {
    const vw = host.clientWidth, vh = host.clientHeight;
    const wx0 = (-zoomT.x) / zoomT.k, wy0 = (-zoomT.y) / zoomT.k;
    const wx1 = (vw - zoomT.x) / zoomT.k, wy1 = (vh - zoomT.y) / zoomT.k;
    mm.append("rect").attr("class", "mm-view")
      .attr("x", px(wx0)).attr("y", py(wy0))
      .attr("width", Math.max(4, (wx1 - wx0) * s)).attr("height", Math.max(4, (wy1 - wy0) * s));
  }
  mm.on("pointerdown", (e) => {
    const [mx, my] = d3.pointer(e);
    const wx = (mx - ox) / s + minX, wy = (my - oy) / s + minY;
    const host2 = document.getElementById("canvasHost");
    const t = d3.zoomIdentity.translate(host2.clientWidth / 2 - wx * zoomT.k, host2.clientHeight / 2 - wy * zoomT.k).scale(zoomT.k);
    svg.transition().duration(200).call(zoom.transform, t);
  });
}

/* =====================================================================
   Tabbed content viewer
   ===================================================================== */
const TABS = ["Overview", "Attributes", "Records", "Raw"];
let activeTab = "Overview";
const tabsStrip = paneTabs.querySelector("#tabsStrip");
const tabBody = paneTabs.querySelector("#tabBody");

TABS.forEach(t => {
  const b = document.createElement("button");
  b.textContent = t;
  b.classList.toggle("active", t === activeTab);
  b.addEventListener("click", () => { activeTab = t; [...tabsStrip.children].forEach(c => c.classList.toggle("active", c === b)); renderContent(selectedId); });
  tabsStrip.append(b);
});

function renderContent(id) {
  const d = id ? BY_ID[id] : null;
  const meta = paneTabs.querySelector("#tabsMeta");
  if (!d || d._t === "n2") {
    tabBody.innerHTML = `<div class="empty">select a node in the canvas</div>`;
    if (meta) meta.textContent = "";
    return;
  }
  if (meta) meta.textContent = d.id;
  let inner = `<h1 class="node-title">${d.label}</h1><div class="node-sub">${(d.kind || "node").toUpperCase()} · ${d.id}</div>`;

  if (activeTab === "Overview") {
    inner += `<div class="prose"><p>${d.blurb}</p>`;
    if (d.edge && d.id !== "metric") inner += `<p><span class="k">metric ${d.edge} ${d.label.toLowerCase()}</span></p>`;
    if (d.stats) inner += `<p>Instances: <span class="k">${d.stats.count}</span> · coverage <span class="k">${d.stats.coverage}</span> · last run <span class="k">${d.stats.lastRun}</span></p>`;
    inner += `</div>`;
    if (d.evidence && d.evidence.length) inner += `<div class="ev-link" data-jump="${d.id}">▸ ${d.evidence.length} evidence span(s) — highlight in document</div>`;
  } else if (activeTab === "Attributes") {
    inner += `<table class="kv">` + Object.entries(d.attributes || {}).map(([k, v]) => `<tr><td class="k">${k}</td><td class="v">${v}</td></tr>`).join("") + `</table>`;
  } else if (activeTab === "Records") {
    inner += `<table class="rec"><thead><tr><th>id</th><th>name</th><th>meta</th><th>status</th></tr></thead><tbody>` +
      (d.records || []).map(r => `<tr><td>${r[0]}</td><td style="font-family:var(--sans)">${r[1]}</td><td style="color:var(--ink-dim)">${r[2]}</td><td><span class="pill ${r[3]}">${r[3]}</span></td></tr>`).join("") +
      `</tbody></table>`;
  } else if (activeTab === "Raw") {
    const clone = Object.assign({}, d); delete clone._t; delete clone.x; delete clone.y; delete clone.vx; delete clone.vy; delete clone.fx; delete clone.fy; delete clone.index;
    inner += `<pre class="raw">${syntaxJSON(clone)}</pre>`;
  }
  tabBody.innerHTML = inner;
  const jump = tabBody.querySelector("[data-jump]");
  if (jump) jump.addEventListener("click", () => renderEvidence(jump.dataset.jump, true));
}

function syntaxJSON(obj) {
  const j = JSON.stringify(obj, null, 2);
  return j
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/"([^"]+)":/g, '<span class="j-key">"$1"</span>:')
    .replace(/: "([^"]*)"/g, ': <span class="j-str">"$1"</span>')
    .replace(/: (\d+\.?\d*)/g, ': <span class="j-num">$1</span>')
    .replace(/: (true|false)/g, ': <span class="j-bool">$1</span>');
}

/* =====================================================================
   PDF viewer (faux) + evidence sync
   ===================================================================== */
const pdfDoc = panePdf.querySelector("#pdfDoc");
const pdfScroll = panePdf.querySelector("#pdfScroll");
const pdfHint = panePdf.querySelector("#pdfHint");
let pdfZoom = 1;

function buildPdf() {
  pdfDoc.innerHTML = PDF_PAGES.map(p => `
    <div class="pdf-page" data-page="${p.n}">
      <h2>${p.title}</h2>
      <div class="clause-no">${p.sub}</div>
      <div style="height:14px"></div>
      ${p.clauses.map(c => `<p><span class="clause-no">${c.no}</span> &nbsp;<strong style="color:#dfe9f1">${c.h}.</strong> ${c.html}</p>`).join("")}
      <div class="pg-foot">TPS-118 · PAGE ${p.n} / ${PDF_PAGES.length}</div>
    </div>`).join("");
  pdfDoc.querySelectorAll("mark").forEach(m => {
    m.addEventListener("click", () => {
      const span = m.dataset.span;
      // find a node whose evidence references this span
      const owner = [CENTER, ...SATS].find(n => (n.evidence || []).some(e => e.span === span));
      if (owner) {
        selectNode(owner.id);
        const g = gNodes.selectAll("g.node").filter(d => d.id === owner.id);
        g.classed("flash", true); setTimeout(() => g.classed("flash", false), 900);
      }
      m.classList.add("flash"); setTimeout(() => m.classList.remove("flash"), 900);
    });
  });
}
function renderEvidence(id, scroll) {
  pdfDoc.querySelectorAll("mark.is-active").forEach(m => m.classList.remove("is-active"));
  const d = id ? BY_ID[id] : null;
  const spans = (d && d.evidence) ? d.evidence.map(e => e.span) : [];
  if (!spans.length) { pdfHint.textContent = d && d._t !== "n2" ? "no evidence spans" : ""; return; }
  let first = null;
  spans.forEach(s => pdfDoc.querySelectorAll(`mark[data-span="${s}"]`).forEach(m => { m.classList.add("is-active"); if (!first) first = m; }));
  pdfHint.textContent = `${spans.length} span(s) · ${d.label}`;
  if (scroll && first) first.scrollIntoView({ behavior: "smooth", block: "center" });
}
function applyPdfZoom() {
  pdfDoc.style.transform = `scale(${pdfZoom})`;
  panePdf.querySelector("#pdfZoom").textContent = Math.round(pdfZoom * 100) + "%";
}
panePdf.querySelector(".pdf-toolbar").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const k = b.dataset.pz;
  if (k === "in") pdfZoom = clamp(pdfZoom + 0.1, 0.5, 2);
  else if (k === "out") pdfZoom = clamp(pdfZoom - 0.1, 0.5, 2);
  else pdfZoom = 1;
  applyPdfZoom();
});

/* =====================================================================
   Boot
   ===================================================================== */
[...document.querySelectorAll("#layoutSeg button")].forEach(x => x.classList.toggle("active", x.dataset.layout === state.layout));
buildLayout();
buildPdf();
render();
updateCanvasMeta();
selectNode("metric");
sim.alpha(1).restart();
setTimeout(fitGraph, 300);
setTimeout(fitGraph, 1100);

const ro = new ResizeObserver(() => { resizeGraph(); drawMinimap(); });
ro.observe(document.getElementById("canvasHost"));
window.addEventListener("resize", () => { resizeGraph(); drawMinimap(); });
</script>
