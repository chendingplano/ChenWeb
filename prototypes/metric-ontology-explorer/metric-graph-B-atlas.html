<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Metric Ontology Explorer — Atlas (Prototype B)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Archivo:wght@500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<style>
  :root {
    --paper: #f6f1e7;
    --paper-2: #efe8d9;
    --card: #fbf8f1;
    --ink: #24201a;
    --ink-soft: #5a5243;
    --ink-faint: #8c8271;
    --rule: #ddd3bf;
    --rule-soft: #e7ddc9;
    --teal: #0f5f5c;
    --teal-soft: #cfe2df;
    --terra: #b0532c;
    --gold: #a8791f;
    --display: "Fraunces", Georgia, "Times New Roman", serif;
    --body: "Spectral", Georgia, serif;
    --ui: "Archivo", ui-sans-serif, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--body); font-size: 14px;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  ::selection { background: rgba(15, 95, 92, 0.18); }

  .app { display: flex; flex-direction: column; height: 100vh; }

  .topbar {
    display: flex; align-items: baseline; gap: 22px;
    height: 58px; padding: 0 26px;
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
    flex: 0 0 auto; position: relative; z-index: 20;
  }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand .glyph {
    align-self: center;
    width: 26px; height: 26px; border-radius: 50%;
    border: 1.5px solid var(--teal);
    position: relative;
  }
  .brand .glyph::after {
    content: ""; position: absolute; width: 7px; height: 7px; border-radius: 50%;
    background: var(--terra); top: 50%; left: 50%; transform: translate(-50%, -50%);
  }
  .brand .title {
    font-family: var(--display); font-weight: 600;
    font-size: 19px; letter-spacing: 0.01em; font-optical-sizing: auto;
  }
  .crumb {
    font-family: var(--ui); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.18em; color: var(--ink-faint);
  }
  .topbar .spacer { flex: 1; }

  .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; background: var(--card); }
  .seg button {
    appearance: none; border: 0; background: transparent;
    font-family: var(--ui); font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-faint); padding: 7px 15px; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
  }
  .seg button svg { width: 13px; height: 13px; }
  .seg button.active { background: var(--teal); color: #f6f1e7; }
  .seg button:hover:not(.active) { color: var(--ink); }
  .link-btn {
    appearance: none; background: transparent; border: 0; cursor: pointer;
    font-family: var(--ui); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-faint); padding: 6px 2px;
    border-bottom: 1px solid transparent;
  }
  .link-btn:hover { color: var(--teal); border-bottom-color: var(--teal); }

  #workspace { flex: 1 1 auto; display: flex; min-height: 0; min-width: 0; }
  .group { display: flex; min-width: 0; min-height: 0; }
  .group.vert { flex-direction: column; }
  .group.horz { flex-direction: row; }

  .pane {
    background: var(--paper); min-width: 0; min-height: 0;
    display: flex; flex-direction: column; position: relative; overflow: hidden;
  }
  .pane-head {
    display: flex; align-items: baseline; gap: 12px;
    padding: 13px 22px 11px;
    flex: 0 0 auto;
  }
  .pane-head .lbl {
    font-family: var(--ui); font-size: 10px; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--ink-faint);
  }
  .pane-head .sub {
    font-family: var(--display); font-style: italic; font-size: 13px; color: var(--ink-soft);
  }
  .pane-head .grow { flex: 1; }

  .splitter { flex: 0 0 10px; position: relative; z-index: 5; background: transparent; }
  .splitter::after {
    content: ""; position: absolute; background: var(--rule); transition: background 0.15s;
  }
  .splitter[data-axis="x"] { cursor: col-resize; }
  .splitter[data-axis="x"]::after { top: 0; bottom: 0; left: 50%; width: 1px; transform: translateX(-50%); }
  .splitter[data-axis="y"] { cursor: row-resize; }
  .splitter[data-axis="y"]::after { left: 0; right: 0; top: 50%; height: 1px; transform: translateY(-50%); }
  .splitter:hover::after, .splitter.drag::after { background: var(--teal); box-shadow: 0 0 0 3px rgba(15,95,92,0.08); }
  body.resizing { user-select: none; }

  /* ---------- Canvas ---------- */
  #canvasHost { position: absolute; inset: 0; background:
      radial-gradient(circle at 50% 46%, #fbf8f1 0%, #f3ecdd 62%, #ece3d0 100%); }
  #graph { width: 100%; height: 100%; display: block; cursor: grab; }
  #graph.grabbing { cursor: grabbing; }

  .halo { fill: none; stroke: var(--rule-soft); stroke-width: 1px; }

  .edge { stroke: #cabfa6; stroke-width: 1.1px; }
  .edge.primary { stroke: #b7ab8d; }
  .edge.chain { stroke: #c8895a; stroke-width: 1.3px; stroke-dasharray: 1 4; stroke-linecap: round; }
  .edge-label {
    font-family: var(--ui); font-size: 9.5px; letter-spacing: 0.12em;
    text-transform: uppercase; fill: var(--ink-faint); pointer-events: none;
  }

  .node { cursor: pointer; }
  .node .nrect {
    fill: var(--card); stroke: var(--teal); stroke-width: 1.2px;
    transition: fill .25s, stroke .2s, stroke-width .2s;
    filter: drop-shadow(0 6px 14px rgba(60, 46, 20, 0.10));
  }
  .node .nicon { fill: none; stroke: var(--teal); stroke-width: 1.5px; stroke-linecap: round; stroke-linejoin: round; }
  .node .nlabel {
    font-family: var(--display); font-weight: 500; fill: var(--ink);
    dominant-baseline: middle; font-optical-sizing: auto; font-size: 12.5px;
  }
  .node .nkind {
    font-family: var(--ui); font-size: 8px; letter-spacing: 0.16em;
    text-transform: uppercase; fill: var(--ink-faint);
  }
  .node.n-core .nrect { fill: var(--teal); stroke: var(--teal); }
  .node.n-core .nicon { stroke: #f6f1e7; }
  .node.n-core .nlabel { fill: #f8f4ea; font-weight: 600; font-size: 16px; }
  .node.n-core .ncore-sub {
    font-family: var(--ui); font-size: 8px; letter-spacing: 0.22em;
    text-transform: uppercase; fill: rgba(246, 241, 231, 0.65); dominant-baseline: middle;
  }
  .node.n-chain .nrect { fill: #fcf7ec; stroke: #c8895a; stroke-dasharray: 3 3; stroke-width: 1px; }
  .node.n-chain .nicon { stroke: #b46a3c; }
  .node.n-chain .nlabel { font-size: 10.5px; fill: var(--ink-soft); }
  .node.n-sat:hover .nrect { stroke-width: 1.7px; }
  .node.selected .nrect { stroke: var(--terra); stroke-width: 2px; stroke-dasharray: none; }
  .node.n-chain.active .nrect { stroke: var(--terra); stroke-dasharray: none; stroke-width: 1.8px; fill: #fbeee2; }

  .canvas-controls {
    position: absolute; right: 20px; top: 16px; z-index: 6;
    display: flex; align-items: center; gap: 14px;
    font-family: var(--ui); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-faint);
  }
  .canvas-controls .toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .canvas-controls .switch {
    width: 30px; height: 16px; border-radius: 999px; background: var(--rule);
    position: relative; transition: background 0.2s;
  }
  .canvas-controls .switch::after {
    content: ""; position: absolute; width: 12px; height: 12px; border-radius: 50%;
    background: var(--card); top: 2px; left: 2px; transition: left 0.2s;
    box-shadow: 0 1px 2px rgba(0,0,0,0.25);
  }
  .canvas-controls .toggle.on .switch { background: var(--teal); }
  .canvas-controls .toggle.on .switch::after { left: 16px; }
  .canvas-controls button {
    appearance: none; background: var(--card); border: 1px solid var(--rule);
    border-radius: 999px; width: 24px; height: 24px; cursor: pointer;
    color: var(--ink-soft); font-family: var(--body); font-size: 13px;
  }
  .canvas-controls button:hover { border-color: var(--teal); color: var(--teal); }

  .breadcrumb-trail {
    position: absolute; left: 22px; top: 16px; z-index: 6; max-width: calc(100% - 240px);
    font-family: var(--display); font-style: italic; font-size: 12.5px; color: var(--ink-soft);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .breadcrumb-trail b { font-style: normal; font-weight: 600; color: var(--teal); }
  .breadcrumb-trail .cx { cursor: pointer; }
  .breadcrumb-trail .cx:hover { color: var(--teal); }
  .breadcrumb-trail .cx.here { font-style: normal; font-weight: 600; color: var(--terra); }

  /* ---------- Reader ---------- */
  .tabs-strip {
    display: flex; gap: 4px; padding: 6px 16px 0; align-items: flex-end;
    border-bottom: 1px solid var(--rule); flex: 0 0 auto; overflow-x: auto;
  }
  .tabs-strip::-webkit-scrollbar { height: 0; }
  .rtab {
    appearance: none; background: transparent; border: 1px solid transparent; border-bottom: 0;
    border-radius: 7px 7px 0 0;
    display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
    padding: 8px 12px 9px; cursor: pointer;
    font-family: var(--ui); font-size: 11px; letter-spacing: 0.04em; color: var(--ink-faint);
  }
  .rtab .rtab-ic { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.5px; }
  .rtab:hover { color: var(--ink); }
  .rtab.active { color: var(--teal); background: var(--card); border-color: var(--rule); position: relative; top: 1px; }
  .rtab.chain.active { color: var(--terra); }
  .rtab .x { margin-left: 3px; opacity: 0.5; font-size: 13px; }
  .rtab .x:hover { opacity: 1; color: var(--terra); }

  .tab-body { flex: 1 1 auto; overflow: auto; padding: 22px 26px 40px; }
  .tab-body::-webkit-scrollbar, .pdf-scroll::-webkit-scrollbar { width: 12px; }
  .tab-body::-webkit-scrollbar-thumb, .pdf-scroll::-webkit-scrollbar-thumb {
    background: var(--rule); border-radius: 12px; border: 3px solid var(--paper);
  }

  .entry-kicker {
    font-family: var(--ui); font-size: 10px; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--terra); margin-bottom: 8px;
  }
  .entry-kicker i { font-style: normal; color: var(--ink-faint); }
  .entry-title {
    font-family: var(--display); font-weight: 600; font-size: 30px;
    line-height: 1.1; margin: 0 0 6px; letter-spacing: -0.01em; font-optical-sizing: auto;
  }
  .entry-lede {
    font-family: var(--display); font-style: italic; font-weight: 400;
    font-size: 16px; color: var(--ink-soft); line-height: 1.5;
    margin: 0 0 18px; max-width: 54ch;
    border-bottom: 1px solid var(--rule); padding-bottom: 16px;
  }
  .entry-nav { display: flex; gap: 18px; margin: 0 0 18px; flex-wrap: wrap; }
  .entry-nav button {
    appearance: none; background: transparent; border: 0; padding: 0 0 4px; cursor: pointer;
    font-family: var(--ui); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-faint); border-bottom: 2px solid transparent;
  }
  .entry-nav button.on { color: var(--teal); border-bottom-color: var(--teal); }
  .entry-nav button:hover { color: var(--ink); }
  .chain-inline { font-family: var(--ui); font-size: 11px; letter-spacing: 0.03em; color: var(--teal); }
  .chain-inline i { color: var(--ink-faint); font-style: normal; }

  .prose { max-width: 58ch; }
  .prose h3 {
    font-family: var(--ui); font-size: 10.5px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--ink-faint); margin: 22px 0 8px;
  }
  .prose p { margin: 0 0 13px; line-height: 1.68; }
  .prose .drop::first-letter {
    font-family: var(--display); font-weight: 600; font-size: 3.1em;
    float: left; line-height: 0.82; padding: 6px 8px 0 0; color: var(--teal);
  }
  .kv-list { list-style: none; margin: 0; padding: 0; max-width: 56ch; }
  .kv-list li { display: flex; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--rule-soft); }
  .kv-list .k {
    font-family: var(--ui); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-faint); flex: 0 0 40%;
  }
  .kv-list .v { color: var(--ink); }

  .rec-meta { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; flex-wrap: wrap; }
  .tbl-pill {
    font-family: var(--ui); font-size: 10px; letter-spacing: 0.08em;
    background: var(--teal); color: #f6f1e7; padding: 3px 9px; border-radius: 999px;
  }
  .tbl-pill.stage { background: var(--gold); }
  .rec-count { font-family: var(--ui); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-faint); }
  .rec-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 6px; }
  .rec-table { border-collapse: collapse; width: 100%; font-family: var(--ui); font-size: 11.5px; }
  .rec-table th {
    text-align: left; padding: 8px 12px; background: var(--paper-2);
    font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint);
    border-bottom: 1px solid var(--rule); white-space: nowrap;
  }
  .rec-table td { padding: 8px 12px; border-bottom: 1px solid var(--rule-soft); color: var(--ink-soft); white-space: nowrap; }
  .rec-table tbody tr:last-child td { border-bottom: 0; }
  .rec-table tr:hover td { background: #fbf7ee; }
  .rec-ev {
    appearance: none; margin-top: 14px; cursor: pointer;
    background: var(--card); border: 1px solid var(--rule); border-radius: 6px;
    padding: 7px 12px; font-family: var(--ui); font-size: 10px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--terra);
  }
  .rec-ev:hover { border-color: var(--terra); }

  .source-card {
    background: var(--card); border: 1px solid var(--rule);
    border-left: 3px solid var(--teal); padding: 14px 16px; margin: 0 0 12px; max-width: 56ch;
  }
  .source-card blockquote {
    margin: 0 0 6px; font-family: var(--display); font-style: italic; font-size: 15px; color: var(--ink);
  }
  .source-card cite {
    font-family: var(--ui); font-size: 10px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-faint); font-style: normal;
  }
  .source-card .goto {
    display: inline-block; margin-top: 8px; cursor: pointer;
    font-family: var(--ui); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--terra);
  }
  .source-card .goto:hover { text-decoration: underline; }

  .empty {
    height: 100%; display: grid; place-items: center; padding: 40px; text-align: center;
    color: var(--ink-faint); font-family: var(--display); font-style: italic; font-size: 16px;
  }

  /* ---------- PDF ---------- */
  .pdf-toolbar { display: flex; align-items: center; gap: 14px; padding: 13px 22px 11px; flex: 0 0 auto; }
  .pdf-toolbar .lbl {
    font-family: var(--ui); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-faint);
  }
  .pdf-toolbar .note { font-family: var(--display); font-style: italic; font-size: 13px; color: var(--terra); }
  .pdf-toolbar .grow { flex: 1; }
  .pdf-toolbar button {
    appearance: none; background: var(--card); border: 1px solid var(--rule);
    width: 24px; height: 24px; border-radius: 4px; cursor: pointer; color: var(--ink-soft); font-size: 13px;
  }
  .pdf-toolbar button:hover { border-color: var(--teal); color: var(--teal); }
  .pdf-toolbar .zoom { font-family: var(--ui); font-size: 10px; color: var(--ink-faint); min-width: 34px; text-align: center; }

  .pdf-wrap { flex: 1 1 auto; display: flex; min-height: 0; }
  .pdf-rail {
    flex: 0 0 74px; border-right: 1px solid var(--rule);
    padding: 16px 10px; display: flex; flex-direction: column; gap: 10px; overflow: auto;
  }
  .pdf-rail .thumb {
    border: 1px solid var(--rule); background: var(--card);
    aspect-ratio: 3/4; border-radius: 2px; cursor: pointer; position: relative; padding: 6px;
  }
  .pdf-rail .thumb.active { border-color: var(--teal); box-shadow: 0 0 0 2px rgba(15,95,92,0.12); }
  .pdf-rail .thumb .lines { display: flex; flex-direction: column; gap: 3px; }
  .pdf-rail .thumb .lines i { height: 2px; background: var(--rule); display: block; }
  .pdf-rail .thumb .no {
    position: absolute; bottom: 3px; right: 5px;
    font-family: var(--ui); font-size: 8px; color: var(--ink-faint);
  }

  .pdf-scroll { flex: 1 1 auto; overflow: auto; padding: 26px 30px; background: var(--paper-2); }
  .pdf-doc { width: 540px; margin: 0 auto; transform-origin: top center; }
  .pdf-page {
    background: #fdfaf3; border: 1px solid var(--rule);
    box-shadow: 0 22px 44px -18px rgba(60, 46, 20, 0.28);
    padding: 52px 56px; margin-bottom: 26px;
    font-family: var(--body); color: var(--ink); line-height: 1.78; font-size: 13px;
  }
  .pdf-page h2 { font-family: var(--display); font-weight: 600; font-size: 17px; margin: 0 0 2px; letter-spacing: -0.01em; }
  .pdf-page .doc-sub { font-family: var(--display); font-style: italic; font-size: 13px; color: var(--ink-soft); margin-bottom: 20px; }
  .pdf-page .clause-no { font-family: var(--ui); font-size: 10px; letter-spacing: 0.08em; color: var(--teal); }
  .pdf-page p { margin: 0 0 15px; }
  .pdf-page strong { color: var(--ink); }
  .pdf-page mark {
    background: transparent; color: inherit;
    box-shadow: inset 0 -0.55em 0 rgba(168, 121, 31, 0.16); cursor: pointer; padding: 0 1px;
  }
  .pdf-page mark.is-active { box-shadow: inset 0 -0.62em 0 rgba(176, 83, 44, 0.28); color: #3a1f12; }
  .pdf-page mark.flash { box-shadow: inset 0 -0.7em 0 rgba(15, 95, 92, 0.3); }
  .pg-foot {
    margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--rule);
    font-family: var(--ui); font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-faint); text-align: center;
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="glyph"></span>
      <span class="title">Metric Ontology Explorer</span>
    </div>
    <span class="crumb">Knowledge · Ontology</span>
    <span class="spacer"></span>
    <div class="seg" id="layoutSeg">
      <button data-layout="tb" class="active" title="Top / Bottom">
        <svg viewBox="0 0 16 16"><rect x="1" y="1" width="14" height="6.5" rx="1" fill="none" stroke="currentColor"/><rect x="1" y="9" width="6" height="6" rx="1" fill="none" stroke="currentColor"/><rect x="9" y="9" width="6" height="6" rx="1" fill="none" stroke="currentColor"/></svg>
        Top · Bottom
      </button>
      <button data-layout="lr" title="Left / Right">
        <svg viewBox="0 0 16 16"><rect x="1" y="1" width="6.5" height="14" rx="1" fill="none" stroke="currentColor"/><rect x="9" y="1" width="6" height="6" rx="1" fill="none" stroke="currentColor"/><rect x="9" y="9" width="6" height="6" rx="1" fill="none" stroke="currentColor"/></svg>
        Left · Right
      </button>
    </div>
    <button class="link-btn" id="resetLayout">Reset panes</button>
  </header>
  <div id="workspace"></div>
</div>

<template id="paneTemplates">
  <section class="pane" id="paneCanvas">
    <div class="pane-head"><span class="lbl">The Ontology</span><span class="sub" id="canvasSub">an orrery of what a metric touches</span><span class="grow"></span></div>
    <div class="pane-body" style="flex:1 1 auto; min-height:0; position:relative;">
      <div id="canvasHost">
        <svg id="graph"></svg>
        <div class="breadcrumb-trail" id="trail"></div>
        <div class="canvas-controls">
          <span class="toggle" id="orbitToggle"><span class="switch"></span> Orbit motion</span>
          <button data-z="fit" title="Recentre">◎</button>
          <button data-z="in">+</button>
          <button data-z="out">−</button>
        </div>
      </div>
    </div>
  </section>

  <section class="pane" id="paneTabs">
    <div class="pane-head"><span class="lbl">Reader</span><span class="sub" id="tabsSub"></span></div>
    <div class="tabs-strip" id="tabsStrip"></div>
    <div class="tab-body" id="tabBody"></div>
  </section>

  <section class="pane" id="panePdf">
    <div class="pdf-toolbar">
      <span class="lbl">Source</span>
      <span class="note" id="pdfNote"></span>
      <span class="grow"></span>
      <button data-pz="out">−</button><span class="zoom" id="pdfZoom">100%</span><button data-pz="in">+</button><button data-pz="fit">◎</button>
    </div>
    <div class="pdf-wrap">
      <div class="pdf-rail" id="pdfRail"></div>
      <div class="pdf-scroll" id="pdfScroll"><div class="pdf-doc" id="pdfDoc"></div></div>
    </div>
  </section>
</template>

<script>
/* =====================================================================
   Metric Ontology Explorer — Prototype B "Atlas" (v2)
   Rectangular nodes on an elliptical orrery. Click a satellite to unfold
   its downstream chain (one at a time); the satellite swings to the
   right and the chain unfurls into open space. Click a chain node to

const workspace = document.getElementById("workspace");

const DEFAULTS = { layout: "tb", canvasH: 372, leftW: 500, tabsW: 440 };
let state = loadState();
function loadState() {
  try { const s = JSON.parse(localStorage.getItem(LS_KEY)); if (s && s.layout) return Object.assign({}, DEFAULTS, s); } catch (e) {}
  return Object.assign({}, DEFAULTS);
}
function saveState() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function buildLayout() {
  workspace.textContent = "";
  workspace.style.flexDirection = state.layout === "lr" ? "row" : "column";
  if (state.layout === "lr") {
    const left = groupEl("vert");
    left.style.cssText = `width:${state.leftW}px;flex:0 0 ${state.leftW}px`;
    paneCanvas.style.cssText = `flex:0 0 ${state.canvasH}px;height:${state.canvasH}px`;
    paneTabs.style.cssText = "flex:1 1 auto";
    left.append(paneCanvas, splitterEl("y", "canvasH"), paneTabs);
    panePdf.style.cssText = "flex:1 1 auto";
    workspace.append(left, splitterEl("x", "leftW"), panePdf);
  } else {
    paneCanvas.style.cssText = `flex:0 0 ${state.canvasH}px;height:${state.canvasH}px`;
    const bottom = groupEl("horz");
    bottom.style.cssText = "flex:1 1 auto";
    paneTabs.style.cssText = `flex:0 0 ${state.tabsW}px;width:${state.tabsW}px`;
    panePdf.style.cssText = "flex:1 1 auto";
    bottom.append(paneTabs, splitterEl("x", "tabsW"), panePdf);
    workspace.append(paneCanvas, splitterEl("y", "canvasH"), bottom);
  }
  requestAnimationFrame(() => { resizeGraph(); rebuild(false); });
  setTimeout(() => resizeGraph(), 280);
}
function groupEl(k) { const d = document.createElement("div"); d.className = "group " + k; return d; }
function splitterEl(axis, key) {
  const s = document.createElement("div");
  s.className = "splitter"; s.dataset.axis = axis; s.dataset.key = key;
  s.addEventListener("pointerdown", startResize);
  return s;
}
let resize = null;
function startResize(e) {
  const s = e.currentTarget;
  resize = { key: s.dataset.key, startX: e.clientX, startY: e.clientY, startVal: state[s.dataset.key] };
  s.classList.add("drag"); s.setPointerCapture(e.pointerId); document.body.classList.add("resizing");
  s.addEventListener("pointermove", moveResize); s.addEventListener("pointerup", endResize);
}
function moveResize(e) {
  if (!resize) return;
  const dx = e.clientX - resize.startX, dy = e.clientY - resize.startY;
  let v = resize.startVal;
  if (resize.key === "leftW") v = clamp(resize.startVal + dx, 320, workspace.clientWidth - 340);
  else if (resize.key === "tabsW") v = clamp(resize.startVal + dx, 300, workspace.clientWidth - 340);
  else if (resize.key === "canvasH") {
    const host = state.layout === "lr" ? document.querySelector(".group.vert") : workspace;
    v = clamp(resize.startVal + dy, 210, host.clientHeight - 180);
  }
  state[resize.key] = Math.round(v);
  applySizes();
}
function endResize(e) {
  const s = e.currentTarget; s.classList.remove("drag");
  s.removeEventListener("pointermove", moveResize); s.removeEventListener("pointerup", endResize);
  document.body.classList.remove("resizing"); resize = null; saveState();
  resizeGraph();
}
function applySizes() {
  if (state.layout === "lr") {
    const left = document.querySelector(".group.vert");
    if (left) left.style.cssText = `width:${state.leftW}px;flex:0 0 ${state.leftW}px`;
  } else {
    paneTabs.style.cssText = `flex:0 0 ${state.tabsW}px;width:${state.tabsW}px`;
  }
  paneCanvas.style.cssText = `flex:0 0 ${state.canvasH}px;height:${state.canvasH}px`;
  resizeGraph();
}
document.getElementById("layoutSeg").addEventListener("click", (e) => {

});

const CHAIN_STEP_X = 212, CHAIN_ROW_Y = 48;

function nodeDims(d) {
  if (d.t === "core") return { w: 178, h: 66, ic: 20 };
  if (d.t === "sat") return { w: clamp(38 + 14 + 8 + d.label.length * 7.4 + 16, 108, 208), h: 44, ic: 14 };
  return { w: clamp(30 + 12 + 7 + d.label.length * 6.7 + 14, 96, 214), h: 34, ic: 12 };
}

function model() {
  const nodes = [{ id: "metric", t: "core", label: "Metric", ikey: "metric" }];
  SATS.forEach((s, i) => nodes.push({ id: s.id, t: "sat", i, label: s.label, kind: s.kind, ikey: s.id }));
  if (openChain) {
    const i = SAT_INDEX[openChain];
    (CHAINS[openChain] || []).forEach((c, k) =>
      nodes.push({ id: c.id, t: "chain", i, k, label: c.label, ikey: c.kind === "stage" ? "stage" : "entity", parent: openChain }));
  }
  const edges = [];
  SATS.forEach(s => edges.push({ id: "m>" + s.id, a: "metric", b: s.id, primary: true }));
  if (openChain) {
    let prev = openChain;
    (CHAINS[openChain] || []).forEach(c => { edges.push({ id: prev + ">" + c.id, a: prev, b: c.id, chain: true }); prev = c.id; });
  }
  return { nodes, edges };
}

function xyOf(d, r) {
  r = (r === undefined) ? rot : r;
  if (d.t === "core") return { x: 0, y: 0 };
  const a = base(d.i) + r;
  const sx = RX() * Math.cos(a), sy = RY() * Math.sin(a);
  if (d.t === "sat") return { x: sx, y: sy };
  // chain: a vertical column hanging to the right of its satellite
  const n = (CHAINS[openChain] || []).length || 1;
  return { x: sx + CHAIN_STEP_X, y: sy + (d.k - (n - 1) / 2) * CHAIN_ROW_Y };
}

function drawNode(g, d) {
  const dim = nodeDims(d);
  g.append("rect").attr("class", "nrect")
    .attr("x", -dim.w / 2).attr("y", -dim.h / 2).attr("width", dim.w).attr("height", dim.h)
    .attr("rx", d.t === "chain" ? 6 : 9);
  g.append("path").attr("class", "nicon").attr("d", ICON[d.ikey] || ICON.entity)
    .attr("transform", `translate(${-dim.w / 2 + 12}, ${-dim.ic / 2}) scale(${dim.ic / 16})`);
  const lx = -dim.w / 2 + 12 + dim.ic + 8;
  if (d.t === "core") {
    g.append("text").attr("class", "nlabel").attr("x", lx).attr("y", -3).text(d.label);
    g.append("text").attr("class", "ncore-sub").attr("x", lx).attr("y", 13).text("ONTOLOGY CORE");
  } else {
    g.append("text").attr("class", "nlabel").attr("x", lx).attr("y", 1).text(d.label);
  }
  if (d.t === "sat") {
    g.append("text").attr("class", "nkind").attr("x", 0).attr("y", -dim.h / 2 - 7)
      .attr("text-anchor", "middle").text((d.kind || "").toUpperCase());
  }
}

function rebuild(animate) {
  const { nodes, edges } = model();

  rotTarget = rot + shortest((openChain ? -base(SAT_INDEX[openChain]) : 0) - rot);
  startTimer();

  const eSel = gEdges.selectAll("line").data(edges, d => d.id);
  eSel.exit().transition().duration(220).style("opacity", 0).remove();
  eSel.enter().append("line")
    .attr("class", d => "edge" + (d.primary ? " primary" : "") + (d.chain ? " chain" : ""))
    .style("opacity", 0)
    .merge(eSel).transition().duration(animate ? 460 : 0).style("opacity", 1);

  const nSel = gNodes.selectAll("g.node").data(nodes, d => d.id);
  nSel.exit().transition().duration(220).style("opacity", 0).remove();
  const nEnter = nSel.enter().append("g")
    .attr("class", d => "node n-" + d.t)
    .style("opacity", 0)
    .attr("transform", "translate(0,0)")
    .on("click", (e, d) => { e.stopPropagation(); onNode(d); })
    .on("mouseenter", (e, d) => hoverEdge(d))
    .on("mouseleave", () => hoverEdge(null));
  nEnter.each(function (d) { drawNode(d3.select(this), d); });
  nEnter.merge(nSel).transition().duration(animate ? 440 : 0).style("opacity", 1);

  syncSelectionClasses();
  paint();
  fitView(animate);
  renderTrail();
}

function paint() {
  NODE_POS = {};
  gNodes.selectAll("g.node").each(function (d) {
    const p = xyOf(d); NODE_POS[d.id] = p;
    this.setAttribute("transform", `translate(${p.x},${p.y})`);
  });
  gEdges.selectAll("line").each(function (d) {
    const s = NODE_POS[d.a], t = NODE_POS[d.b]; if (!s || !t) return;
    this.setAttribute("x1", s.x); this.setAttribute("y1", s.y);
    this.setAttribute("x2", t.x); this.setAttribute("y2", t.y);
  });
  positionHoverEdge();
  drawAtmos();
}

function drawAtmos() {
  const rx = RX(), ry = RY();
  const sel = gAtmos.selectAll("ellipse").data([0.6, 0.85, 1.12, 1.5]);
  sel.enter().append("ellipse").attr("class", "halo").merge(sel)
    .attr("rx", f => rx * f).attr("ry", f => ry * f);
  sel.exit().remove();
}

function fitView(animate) {
  const h = host(); if (!h) return;
  const W = h.clientWidth, H = h.clientHeight;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  gNodes.selectAll("g.node").each(function (d) {
    const p = xyOf(d, rotTarget), dim = nodeDims(d);
    minX = Math.min(minX, p.x - dim.w / 2); maxX = Math.max(maxX, p.x + dim.w / 2);
    minY = Math.min(minY, p.y - dim.h / 2 - (d.t === "sat" ? 16 : 0)); maxY = Math.max(maxY, p.y + dim.h / 2);
  });
  if (!isFinite(minX)) return;
  const padX = 58, padY = 44;
  const k = clamp(Math.min(W / (maxX - minX + padX * 2), H / (maxY - minY + padY * 2)), 0.42, 1.35);
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  const t = d3.zoomIdentity.translate(W / 2 - cx * k, H / 2 - cy * k).scale(k);
  svg.transition().duration(animate ? 640 : 0).ease(d3.easeCubicInOut).call(zoom.transform, t);
}

function startTimer() {
  if (timer) return;
  timer = d3.timer(() => {
    if (openChain || !orbitOn) {
      rot += (rotTarget - rot) * 0.16;
      if (Math.abs(rotTarget - rot) < 0.0005) { rot = rotTarget; paint(); timer.stop(); timer = null; return; }
    } else {
      rot += 0.0015; rotTarget = rot;
    }
    paint();
  });
}

function onNode(d) {
  if (d.t === "core") {
    focusId = "metric";
    setActiveTab("entry");
    paintEvidenceFor("metric");
    return;
  }
  if (d.t === "sat") {
    focusId = d.id;
    openChain = (openChain === d.id) ? null : (CHAINS[d.id] ? d.id : null);
    openTabs = [];
    activeTab = "entry";
    rebuild(true);
    renderTabs(); renderBody();
    paintEvidenceFor(d.id);
    return;
  }
  openChainNode(d.id);
}

function openChainNode(id) {
  if (!openTabs.includes(id)) openTabs.push(id);
  activeTab = id;
  syncSelectionClasses(); renderTabs(); renderBody(); renderTrail();
}

function syncSelectionClasses() {
  gNodes.selectAll("g.node")
    .classed("selected", d => d.id === focusId && d.t !== "core")
    .classed("active", d => d.t === "chain" && d.id === activeTab);
}

function hoverEdge(d) {
  hoverId = (d && d.t === "sat") ? d.id : null;
  gEdgeLabels.selectAll("*").remove();
  if (!hoverId) return;
  const s = SATS[SAT_INDEX[hoverId]];
  gEdgeLabels.append("text").attr("class", "edge-label").attr("text-anchor", "middle").text((s.edge || "").toUpperCase());
  positionHoverEdge();
}
function positionHoverEdge() {
  if (!hoverId) return;
  const p = NODE_POS[hoverId]; if (!p) return;
  const tx = gEdgeLabels.select("text"); if (tx.empty()) return;
  tx.attr("x", p.x * 0.5).attr("y", p.y * 0.5 - 4);
}

const orbitToggle = paneCanvas.querySelector("#orbitToggle");
orbitToggle.addEventListener("click", () => {
  orbitOn = !orbitOn;
  orbitToggle.classList.toggle("on", orbitOn);
  if (!orbitOn && !openChain) rotTarget = rot + shortest(0 - rot);
  startTimer();
});

document.addEventListener("click", (e) => {
  const b = e.target.closest(".canvas-controls button"); if (!b) return;
  if (b.dataset.z === "in") svg.transition().duration(200).call(zoom.scaleBy, 1.3);
  else if (b.dataset.z === "out") svg.transition().duration(200).call(zoom.scaleBy, 1 / 1.3);
  else fitView(true);
});

function resizeGraph() {
  const h = host(); if (!h) return;
  svg.attr("width", h.clientWidth).attr("height", h.clientHeight).attr("viewBox", `0 0 ${h.clientWidth} ${h.clientHeight}`);
  drawAtmos(); paint(); fitView(false);
}

function renderTrail() {
  const t = document.getElementById("trail"); if (!t) return;
  if (!openChain) { t.innerHTML = `centred on <b>Metric</b>`; return; }
  const chain = CHAINS[openChain] || [];
  t.innerHTML = `<b>Metric</b> · ${BY_ID[openChain].label} `
    + chain.map(c => `<span class="cx${openTabs.includes(c.id) ? " seen" : ""}${activeTab === c.id ? " here" : ""}" data-c="${c.id}">▸ ${c.label}</span>`).join(" ");
  t.querySelectorAll(".cx").forEach(s => s.onclick = () => openChainNode(s.dataset.c));
}

/* =====================================================================
   Reader — entry tab + one record tab per visited chain node
   ===================================================================== */
const tabsStrip = paneTabs.querySelector("#tabsStrip");
const tabBody = paneTabs.querySelector("#tabBody");
let openTabs = [];
let activeTab = "entry";
let activeSection = "Definition";

function setActiveTab(id) { activeTab = id; syncSelectionClasses(); renderTabs(); renderBody(); renderTrail(); }

function renderTabs() {
  tabsStrip.innerHTML = "";
  const et = document.createElement("button");
  et.className = "rtab" + (activeTab === "entry" ? " active" : "");
  et.innerHTML = `<svg class="rtab-ic" viewBox="0 0 16 16"><path d="${ICON[focusId] || ICON.metric}"/></svg><span>${BY_ID[focusId].label}</span>`;
  et.onclick = () => setActiveTab("entry");
  tabsStrip.append(et);
  openTabs.forEach(id => {
    const c = CH_BY_ID[id];
    const t = document.createElement("button");
    t.className = "rtab chain" + (activeTab === id ? " active" : "");
    t.innerHTML = `<svg class="rtab-ic" viewBox="0 0 16 16"><path d="${c.kind === "stage" ? ICON.stage : ICON.entity}"/></svg><span>${c.label}</span><span class="x" data-x="${id}">×</span>`;
    t.onclick = (e) => { if (e.target.dataset.x) { closeTab(id); return; } setActiveTab(id); };
    tabsStrip.append(t);
  });
}
function closeTab(id) {
  openTabs = openTabs.filter(x => x !== id);
  if (activeTab === id) activeTab = "entry";
  syncSelectionClasses(); renderTabs(); renderBody(); renderTrail();
}
function renderBody() {
  const sub = paneTabs.querySelector("#tabsSub");
  if (activeTab === "entry") { if (sub) sub.textContent = openChain ? "chain open" : ""; renderEntry(focusId); }
  else { if (sub) sub.textContent = "record view"; renderRecord(CH_BY_ID[activeTab]); }
}

function renderEntry(id) {
  const d = BY_ID[id];
  const kicker = id === "metric" ? "The centre" : `Metric ${d.edge || "relates to"} ${d.label.toLowerCase()}`;
  const secNav = ["Definition", "Connection", "Processing", "Sources"]
    .map(s => `<button class="${s === activeSection ? "on" : ""}" data-sec="${s}">${s}</button>`).join("");
  let bodyHtml = "";
  if (activeSection === "Definition") {
    bodyHtml = `<div class="prose"><p class="drop">${d.definition}</p>
      <h3>At a glance</h3><ul class="kv-list">`
      + Object.entries(d.facts || {}).map(([k, v]) => `<li><span class="k">${k}</span><span class="v">${v}</span></li>`).join("")
      + `</ul>`;
    if (CHAINS[id]) {
      bodyHtml += `<h3>Downstream</h3><p style="margin:0">Unfolds on the canvas to
        <span class="chain-inline">${CHAINS[id].map(c => c.label).join(" <i>▸</i> ")}</span>.
        ${openChain === id ? "Open now — click a node for its records." : "Click the node to unfold it."}</p>`;
    }
    bodyHtml += `</div>`;
  } else if (activeSection === "Connection") {
    bodyHtml = `<div class="prose"><p>${d.connection}</p></div>`;
  } else if (activeSection === "Processing") {
    bodyHtml = `<div class="prose"><p>${d.processing}</p></div>`;
  } else {
    const s = d.sources || [];
    bodyHtml = s.length ? s.map(src => {
      const q = quoteForSpan(src.span);
      return `<div class="source-card"><blockquote>“${q.text}”</blockquote><cite>TPS-118 · page ${src.page} · ${q.clause}</cite><span class="goto" data-span="${src.span}">Show in source ▸</span></div>`;
    }).join("") : `<div class="prose"><p style="font-style:italic;color:var(--ink-faint)">No source spans recorded.</p></div>`;
  }
  tabBody.innerHTML = `<div class="entry-kicker">${kicker}</div>
    <h1 class="entry-title">${d.label}</h1>
    <p class="entry-lede">${d.lede}</p>
    <div class="entry-nav">${secNav}</div>${bodyHtml}`;
  tabBody.querySelectorAll(".entry-nav button").forEach(b => b.onclick = () => { activeSection = b.dataset.sec; renderBody(); });
  tabBody.querySelectorAll(".goto").forEach(g => g.onclick = () => { paintEvidence((d.sources || []).map(x => x.span), d.label, false); jumpToSpan(g.dataset.span); });
}

function renderRecord(c) {
  const pill = c.table
    ? `<span class="tbl-pill">${c.table}</span>`
    : `<span class="tbl-pill stage">pipeline stage · not a table</span>`;
  const rows = c.rows.map(r => `<tr>${r.map(cell => `<td>${cell}</td>`).join("")}</tr>`).join("");
  tabBody.innerHTML = `<div class="entry-kicker">${BY_ID[c.parent].label} <i>▸</i> ${c.label}</div>
    <h1 class="entry-title">${c.label}</h1>
    <p class="entry-lede">${c.blurb}</p>
    <div class="rec-meta">${pill}<span class="rec-count">${c.rows.length} of ${c.count} · sample</span></div>
    <div class="rec-wrap"><table class="rec-table">
      <thead><tr>${c.columns.map(col => `<th>${col}</th>`).join("")}</tr></thead>
      <tbody>${rows}</tbody></table></div>
    ${c.evidenceSpans ? `<button class="rec-ev" id="recEv">Highlight ${c.evidenceSpans.length} span(s) in source ▸</button>` : ""}`;
  if (c.evidenceSpans) {
    paintEvidence(c.evidenceSpans, c.label, false);
    const b = tabBody.querySelector("#recEv");
    if (b) b.onclick = () => paintEvidence(c.evidenceSpans, c.label, true);
  } else {
    paintEvidence([], c.label, false);
  }
}

/* =====================================================================
   Source pane (faux PDF, book style)
   ===================================================================== */
const pdfDoc = panePdf.querySelector("#pdfDoc");
const pdfScroll = panePdf.querySelector("#pdfScroll");
const pdfRail = panePdf.querySelector("#pdfRail");
const pdfNote = panePdf.querySelector("#pdfNote");
let pdfZoom = 1;

function quoteForSpan(span) {
  for (const p of PDF_PAGES) for (const c of p.clauses) {
    const m = c.html.match(new RegExp(`<mark data-span="${span}">(.*?)</mark>`));
    if (m) return { text: m[1].replace(/<[^>]+>/g, ""), clause: c.no + " " + c.h };
  }
  return { text: "—", clause: "" };
}
function buildPdf() {
  pdfDoc.innerHTML = PDF_PAGES.map(p => `
    <div class="pdf-page" data-page="${p.n}">
      <h2>${p.title}</h2>
      <div class="doc-sub">${p.sub}</div>
      ${p.clauses.map(c => `<p><span class="clause-no">${c.no}</span> &nbsp;<strong>${c.h}.</strong> ${c.html}</p>`).join("")}
      <div class="pg-foot">TPS-118 — page ${p.n} of ${PDF_PAGES.length}</div>
    </div>`).join("");
  pdfRail.innerHTML = PDF_PAGES.map(p => `
    <div class="thumb${p.n === 1 ? " active" : ""}" data-page="${p.n}">
      <div class="lines">${Array.from({ length: 9 }).map((_, i) => `<i style="width:${60 + ((i * 37) % 40)}%"></i>`).join("")}</div>
      <span class="no">${p.n}</span>
    </div>`).join("");
  pdfRail.querySelectorAll(".thumb").forEach(t => t.addEventListener("click", () => {
    pdfDoc.querySelector(`.pdf-page[data-page="${t.dataset.page}"]`).scrollIntoView({ behavior: "smooth", block: "start" });
  }));
  pdfDoc.querySelectorAll("mark").forEach(m => m.addEventListener("click", () => {
    const owner = [CENTER, ...SATS].find(n => (n.sources || []).some(e => e.span === m.dataset.span));
    if (owner) { focusId = owner.id; activeTab = "entry"; syncSelectionClasses(); renderTabs(); renderBody(); paintEvidenceFor(owner.id); }
    m.classList.add("flash"); setTimeout(() => m.classList.remove("flash"), 900);
  }));
  pdfScroll.addEventListener("scroll", updateRail);
}
function updateRail() {
  const pages = [...pdfDoc.querySelectorAll(".pdf-page")];
  const top = pdfScroll.scrollTop + 60;
  let cur = 1;
  pages.forEach(pg => { if (pg.offsetTop <= top) cur = +pg.dataset.page; });
  pdfRail.querySelectorAll(".thumb").forEach(t => t.classList.toggle("active", +t.dataset.page === cur));
}
function paintEvidence(spans, label, scroll) {
  pdfDoc.querySelectorAll("mark.is-active").forEach(m => m.classList.remove("is-active"));
  if (!spans || !spans.length) { pdfNote.textContent = label ? "no marked spans" : ""; return; }
  let first = null;
  spans.forEach(s => pdfDoc.querySelectorAll(`mark[data-span="${s}"]`).forEach(m => { m.classList.add("is-active"); if (!first) first = m; }));
  pdfNote.textContent = `${spans.length} span${spans.length > 1 ? "s" : ""} · ${label}`;
  if (scroll && first) first.scrollIntoView({ behavior: "smooth", block: "center" });
}
function paintEvidenceFor(id) { const d = BY_ID[id]; paintEvidence((d.sources || []).map(s => s.span), d.label, false); }
function jumpToSpan(span) {
  const m = pdfDoc.querySelector(`mark[data-span="${span}"]`);
  if (m) m.scrollIntoView({ behavior: "smooth", block: "center" });
}
function applyPdfZoom() {
  pdfDoc.style.transform = `scale(${pdfZoom})`;
  panePdf.querySelector("#pdfZoom").textContent = Math.round(pdfZoom * 100) + "%";
}
panePdf.querySelector(".pdf-toolbar").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.pz === "in") pdfZoom = clamp(pdfZoom + 0.1, 0.6, 1.8);
  else if (b.dataset.pz === "out") pdfZoom = clamp(pdfZoom - 0.1, 0.6, 1.8);
  else pdfZoom = 1;
  applyPdfZoom();
});

/* ---------- boot ---------- */
[...document.querySelectorAll("#layoutSeg button")].forEach(x => x.classList.toggle("active", x.dataset.layout === state.layout));
buildLayout();
buildPdf();
renderTabs();
renderBody();
rebuild(false);
paintEvidenceFor("metric");
setTimeout(() => resizeGraph(), 320);

const ro = new ResizeObserver(() => resizeGraph());
ro.observe(document.getElementById("canvasHost"));
window.addEventListener("resize", () => resizeGraph());
</script>
</body>
</html>
