[tools]
bun = "latest"
caddy = "latest"
go = "1.25.7"
node = "latest"

[tasks.build-doc-service]
run = "go build -buildvcs=false -o ../../../.cache/doc-service.exe ."

[tasks.doc-service-run]
run = "go run ."

[tasks.doc-service-once]
run = "go run . --once"

[tasks.doc-service-migrate]
run = "go run . --migrate-only"

[tasks.doc-service-verify-schema]
run = "go run . --verify-schema-only"

[tasks.doc-service-start]
run = '''
mkdir -p ../../../.cache
if [ -f ../../../.cache/doc-service.pid ] && kill -0 "$(cat ../../../.cache/doc-service.pid)" 2>/dev/null; then
  echo "doc-service already running (pid $(cat ../../../.cache/doc-service.pid))"
  exit 0
fi
nohup go run . > ../../../.cache/doc-service.log 2>&1 &
echo $! > ../../../.cache/doc-service.pid
echo "doc-service (staging) started (pid $(cat ../../../.cache/doc-service.pid))"
'''

[tasks.doc-service-stop]
run = '''
if [ ! -f ../../../.cache/doc-service.pid ]; then
  echo "doc-service is not running (no pid file)"
  exit 0
fi
PID="$(cat ../../../.cache/doc-service.pid)"
if kill -0 "$PID" 2>/dev/null; then
  kill "$PID"
  echo "stopped doc-service (pid $PID)"
else
  echo "stale pid file found for pid $PID"
fi
rm -f ../../../.cache/doc-service.pid
'''

[tasks.doc-service-status]
run = '''
if [ ! -f ../../../.cache/doc-service.pid ]; then
  echo "doc-service not running"
  exit 1
fi
PID="$(cat ../../../.cache/doc-service.pid)"
if kill -0 "$PID" 2>/dev/null; then
  echo "doc-service running (pid $PID)"
  exit 0
fi
echo "doc-service not running (stale pid $PID)"
exit 1
'''
