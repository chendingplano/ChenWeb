[project]
name = "pdf-parser"
version = "0.1.0"
description = "Unified PDF parser service — polls kb.inputs and dispatches to OpenDataLoader, PaddleOCR, MinerU, or Docling"
requires-python = ">=3.12"
dependencies = [
    "psycopg2-binary>=2.9",
    "PyMuPDF>=1.24",
    "nats-py>=2.8",
    "pytest>=8",
]

[project.optional-dependencies]
docling = [
    "docling>=2.91.0",
]
paddle = [
    "paddleocr>=3",
    "paddlex[ocr]>=3.4",
    "numpy>=1.26",
    "torch>=2.2",
]
dev = [
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
