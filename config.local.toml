# config.local.toml
#
# Local overrides for config.toml. Values defined here are merged on top of
# config.toml at startup (this file takes precedence). It is intended for
# machine-specific or operator-tunable settings and is typically not committed.

# ──────────────────────────────────────────────────────────────────────────
# Document Review tiers (Applications → Document Review, Step 2)
#
# Each key below is a review tier ("category"); its value is the list of
# aspect item names included in that tier. Item names must match the aspect
# `name` values defined by the Document Review checklist (see
# server/api/docreview/aspects.go). Unknown names are ignored.
#
# - Built-in tier keys (must-review, should-review, review-external,
#   review-regulated) keep their friendly labels and display order.
# - You may add your own tiers (e.g. quick-pass = [...]); their label is
#   derived from the key (Title Case) and they appear after the built-in ones.
# - Remove this whole section to fall back to the built-in defaults.
[doc-reviews]
must-review = [
  "logical_flow",
  "completeness",
  "correctness",
  "clarity",
  "testable_claims",
  "evidence_rationale",
  "internal_contradictions",
  "terminology_consistency",
  "cross_reference_correctness",
  "technical_accuracy",
  "assumptions",
  "standards_compliance",
  "security",
  "references",
  "confidentiality",
  "sensitive_data",
  "pii",
]

should-review = [
  "grammar_spelling",
  "tone_voice",
  "formatting_consistency",
  "readability",
  "heading_hierarchy",
  "toc_accuracy",
  "conciseness",
  "relevance",
  "currency",
  "prerequisites",
  "performance",
  "error_handling",
  "limitations",
  "version_history",
  "review_status",
  "ownership",
  "related_documents",
]

review-external = [
  "localization",
  "section_balance",
  "examples",
  "diagrams",
]

review-regulated = [
  "navigability",
  "modularity",
  "requirement_traceability",
  "legal_compliance",
  "regulatory_compliance",
  "internal_policy",
  "data_retention",
  "license_ip",
]
