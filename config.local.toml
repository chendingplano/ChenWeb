# config.local.toml
#
# Local overrides for config.toml. Values defined here are merged on top of
# config.toml at startup (this file takes precedence). It is intended for
# machine-specific or operator-tunable settings and is typically not committed.

# ──────────────────────────────────────────────────────────────────────────
# Document Review tiers (Applications → Document Review, Step 2)
#
# Each key below is a review tier ("category"); its value is the list of
# aspect item names included in that tier. Item names must match the aspect
# `name` values defined by the Document Review checklist (see
# server/api/docreview/aspects.go). Unknown names are ignored.
#
# - Built-in tier keys (must-review, should-review, review-external,
#   review-regulated) keep their friendly labels and display order.
# - You may add your own tiers (e.g. quick-pass = [...]); their label is
#   derived from the key (Title Case) and they appear after the built-in ones.
# - Remove this whole section to fall back to the built-in defaults.
[system]
access_roles = ["admin", "root", "guest", "dev", "k_engineer", "trial"]

[doc-reviews]
must-review = [
  "logical_flow",
  "completeness",
  "correctness",
  "clarity",
  "testable_claims",
  "evidence_rationale",
  "internal_contradictions",
  "terminology_consistency",
  "cross_reference_correctness",
  "technical_accuracy",
  "assumptions",
  "standards_compliance",
  "security",
  "references",
  "confidentiality",
  "sensitive_data",
  "pii",
]

should-review = [
  "grammar_spelling",
  "tone_voice",
  "formatting_consistency",
  "readability",
  "heading_hierarchy",
  "toc_accuracy",
  "conciseness",
  "relevance",
  "currency",
  "prerequisites",
  "performance",
  "error_handling",
  "limitations",
  "version_history",
  "review_status",
  "ownership",
  "related_documents",
]

review-external = [
  "localization",
  "section_balance",
  "examples",
  "diagrams",
]

review-regulated = [
  "navigability",
  "modularity",
  "requirement_traceability",
  "legal_compliance",
  "regulatory_compliance",
  "internal_policy",
  "data_retention",
  "license_ip",
  "metrics",
  "metrics_completeness",
  "provisions",
  "entities",
  "inventory_items",
]

# ──────────────────────────────────────────────────────────────────────────
# Wiki sidebar menu visibility (/home3/knowledge)
#
# Each key is a Wiki sidebar menu item id (top-level section or a child
# item under one, e.g. "kb-doc-wiki" for the "Wiki" section, "kb-metrics"
# for its "Metrics" child). The value is whether the item is shown.
#
# - Ids not listed here default to enabled (true).
# - Disabling a top-level id hides that whole section, including all of its
#   children, regardless of their own settings.
# - Disabling a child id hides only that child; its parent and siblings are
#   unaffected, unless doing so leaves the parent with no visible children,
#   in which case the parent is hidden too.
# - Remove this whole section to show the full menu (built-in default).
#
[knowledge-content]
kb-references = false
kb-formulas = false
kb-tables = false
kb-quotations = false
kb-case-studies = false
kb-workflow = false
kb-topic-tree = false
kb-product-parts = false
kb-products = false

# ──────────────────────────────────────────────────────────────────────────
# /semos/workspace content visibility (ADR 2026071701)
#
# Each key is a workspace content id: either one of the fixed masthead ids
# (ws-kicker, ws-banner-title, ws-banner-subtitle, ws-announcements), or an
# app tile's `key` from [[workspace.apps]] in the active site-config TOML
# (e.g. "knowledge_base", "chat" — see config/site/site-default*.toml). The
# value is whether the item is shown.
#
# - Ids not listed here default to enabled (true).
# - This section is commented out — shipping this feature is a no-op until
#   uncommented and edited.
# - Per-language labels for these same ids live in
#   config/workspace-content/labels-<lang>.toml, not here.
#
# [workspace-content]
# ws-announcements = false
# workflows = false

[doc-processing-policy-no-entities-relations]
description = "This is the system default policy. It contains all but entities and relations processors"
is_default = true
processors = [
	"extract_metrics",
	"extract_provisions",
	"extract_semantic_projections",
	"generate_topics",
	"generate_scene_blocks",
	"extract_inventory_items"]

[doc-processing-policy-all]
description = "This policy includes all the doc processors"
is_default = false
processors = [
	"extract_metrics",
	"extract_provisions",
	"extract_semantic_projections",
	"extract_entity",
	"extract_relation",
	"generate_topics",
	"generate_scene_blocks",
	"extract_inventory_items"]

[doc-processing-policy-bindings]
Research = "doc-processing-policy-all"

[languages]
# Must match the frontend's paraglide locale codes (web/project.inlang/settings.json
# "locales", e.g. "zh-cn" not "zh") — these are the languages workspacelists
# (kb.site_announcements / kb.recent_activities) writes one row per, and the
# workspace page requests by via ?lang=<getLocale()>.
languages = ["en", "zh-cn"]
default = "zh-cn"

[config]
config_filename = "config/site/site-default-zh-cn.toml"

[frontend]
default_knowledge_store = "Research"
enable_login_with_github = false
enable_login_with_google = true
enable_phone_login = true
announcements_max = 5
