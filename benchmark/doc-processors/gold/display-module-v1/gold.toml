# Gold ontology and synthetic corpus source for the "显示屏模块" (display module)
# vertical slice — ADR 2026072901 (KnowledgeStore/doc-repo/adrs/202607/
# 2026072901-adr-semantic-platform-and-adaptive-pipeline.md), DR12/DR15/DR20-DR23/DR25.
#
# ALL document numbers, issuers, editions, clause numbers, and values in this file are
# SYNTHETIC. None of them are real standards. This is deliberate: ground truth for a
# benchmark must be authored, not inferred, so every gold answer below is true by
# construction rather than by expert labeling. Do not cite anything in this file as a
# real regulatory requirement.
#
# Status: draft, P0. Three consumers:
#   1. Benchmark corpus generator (ChenWeb/benchmark/doc-processors/generator) renders
#      each [[authority_document]] as a CDM document (server/api/cdm/model) from its
#      clause text_templates, so grounding (ADR 2026072601) is exact by construction.
#   2. extract_metrics / normalize_assertions benchmark gold: [[clause]].expected_metric.
#   3. Machine-consumed project fixture content, with ChenWeb as the approved home for
#      this checked-in synthetic corpus. Any later relocation to an ontology data
#      repository (DR17) requires a separate decision. [[metric_definition]] remains
#      close to future module terms.toml content; [[clause]] values remain candidate
#      conformance fixtures for the profile rules they instantiate.
#
# Store-profile metadata in manifest.json currently groups the 9 synthetic documents as:
#   - regulated-reference / authority-standard (5 docs)
#   - product-specification / enterprise-standard (3 docs)
#   - narrative-research / marketing-narrative (1 doc)
# These profile expectations are benchmark metadata only; they do not by themselves
# define or guarantee the deployed runtime's routing behavior.
#
# Every [[expected_verdict]] is derived by hand from the DR21 strictness relation over
# the authored clause values, with the deciding rule stated in `rationale`. Where the
# comparator disagrees with this file, the comparator is the thing to investigate first
# for a coding bug; where it agrees but the *rationale* here turns out to be unsound,
# this file is wrong and must be corrected — an expected_verdict is not authoritative
# merely by being checked in.

[module]
id = "display-module-v1"
title = "Display module (显示屏模块) — pilot fixture for ventilator (呼吸机) domain"
part_class_id = "vent:display_module"
part_parent_class_id = "vent:ventilator"
subject_organization = "华康医疗设备有限公司（合成示例，非真实企业）"
notes = """
Part class hierarchy for this fixture (DR20 — roles, not classes):
  vent:ventilator
    part_of <- vent:display_module        (this fixture's target class)
    part_of <- vent:control_knob_module
    part_of <- vent:breathing_circuit_module
    part_of <- vent:filter_valve
    part_of <- vent:sensor_valve_module
    part_of <- vent:caster_module
    part_of <- vent:base_module
  vent:display_module
    component_of -> vent:display_panel     (used by M1's asserted-level dial)
"""

# ── metric definitions ───────────────────────────────────────────────────────────
# The row identity of the comparison matrix (DR23). Aliases are lexicon (DR15/DR16)
# content, aligned to the term via `aligns_to_term`, not stored as term duplicates.

[[metric_definition]]
id = "vent:display_brightness"
quantity_kind = "Luminance"
canonical_unit = "cd/m2"
value_form = "lower_bound"
applies_to_class = "vent:display_module"
asserted_level = "vent:display_panel"          # DR20: metric is asserted at the sub-part
pref_label_zh = "显示亮度"
pref_label_en = "display brightness"
alt_labels_zh = ["亮度", "屏幕亮度", "显示器亮度"]
alt_labels_en = ["luminance", "screen brightness"]
definition = "Luminance of the primary display surface under intended ambient conditions."
dial = "stronger/weaker + supersession + alias + restated-list + asserted-level roll-up"

[[metric_definition]]
id = "vent:static_contrast_ratio"
quantity_kind = "Dimensionless"
canonical_unit = "ratio"                        # expressed "N:1"; comparator treats N as the scalar
value_form = "lower_bound"
applies_to_class = "vent:display_module"
pref_label_zh = "静态对比度"
pref_label_en = "static contrast ratio"
alt_labels_zh = ["对比度(静态)"]
alt_labels_en = ["static CR"]
definition = "Ratio of luminance between the brightest and darkest static elements displayable at once."
dial = "identical + incomparable"

# Near-miss distractor: lexically close to static_contrast_ratio ("对比度" substring
# overlap) but a DIFFERENT concept. The reconciler/lexicon must keep these as two
# concepts; a benchmark pass requires zero cross-contamination between the two rows.
[[metric_definition]]
id = "vent:dynamic_contrast_ratio"
quantity_kind = "Dimensionless"
canonical_unit = "ratio"
value_form = "lower_bound"
applies_to_class = "vent:display_module"
pref_label_zh = "动态对比度"
pref_label_en = "dynamic contrast ratio"
definition = "Marketing-collateral ratio computed across backlight-modulated extremes; not a regulated metric."
dial = "near-miss distractor — must not merge with vent:static_contrast_ratio"
is_distractor = true

[[metric_definition]]
id = "vent:alarm_response_time"
quantity_kind = "Time"
canonical_unit = "ms"
value_form = "upper_bound"
applies_to_class = "vent:display_module"
pref_label_zh = "报警响应时间"
pref_label_en = "alarm response time"
definition = "Elapsed time from an alarm-triggering condition to visible alarm indication."
dial = "stronger + identical + equivalent(unit conversion) + conflict — one row, four verdict kinds"

[[metric_definition]]
id = "vent:touch_response_time"
quantity_kind = "Time"
canonical_unit = "ms"
value_form = "upper_bound"
applies_to_class = "vent:display_module"
pref_label_zh = "触控响应时间"
pref_label_en = "touch response time"
definition = "Elapsed time from a touchscreen input to visible UI feedback."
dial = "qualitative_only x3 + standard_absent — corrects the mock's over-optimistic 一致"

[[metric_definition]]
id = "vent:screen_resolution"
quantity_kind = "Dimensionless"
canonical_unit = "px_pair"                      # compound (width x height); see note below
value_form = "lower_bound"
applies_to_class = "vent:display_module"
pref_label_zh = "屏幕分辨率"
pref_label_en = "screen resolution"
definition = "Native addressable resolution of the display panel."
dial = "limit_absent x4 — property is universally expected, no authority gives a decidable bound"
note = """
Modeled as a single scalar (width*height) for this fixture only. The framework's real
value model (research §6.2) does not have a first-class 'paired quantity' value_form;
if a second real compound metric appears in the pilot module, add one rather than
inventing more px_pair-style workarounds here.
"""

[[metric_definition]]
id = "vent:effective_viewing_angle"
quantity_kind = "Angle"
canonical_unit = "degree"
value_form = "lower_bound"
applies_to_class = "vent:display_module"
pref_label_zh = "有效视角"
pref_label_en = "effective viewing angle"
definition = "Angular range from which display content remains legible, given separately per axis."
components = ["horizontal", "vertical"]          # condition/qualifier is part of metric identity
dial = "qualitative_only x3 + indeterminate(open dimension, missing evidence) — not standard_absent"

[[metric_definition]]
id = "vent:cleaning_disinfection_cycles"
quantity_kind = "Count"
canonical_unit = "count"
value_form = "lower_bound"
applies_to_class = "vent:display_module"
pref_label_zh = "清洁消毒耐受次数"
pref_label_en = "cleaning/disinfection tolerance"
definition = "Number of cleaning/disinfection cycles the surface withstands without functional failure."
dial = "weaker + recommendation example (mock's 建议提高 annotation, worked end to end)"

[[metric_definition]]
id = "vent:key_parameter_readability"
quantity_kind = "Dimensionless"
value_form = "qualitative"
applies_to_class = "vent:display_module"
pref_label_zh = "关键参数可读性"
pref_label_en = "key parameter readability"
definition = "Legibility of safety-critical displayed values under intended-use viewing conditions."
dial = "qualitative_only x4 (standalone) + not_applicable x4 (excluded product variant)"
applicability_condition = "适用于台式/移动式呼吸机；不适用于集成于麻醉工作站的呼吸机显示模块"

