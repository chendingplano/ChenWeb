name = "synthetic-v1-example"
dataset = "doc-processors-synthetic-core@1.0.0"
processors = ["chunking", "extract_metrics"]
repetitions = 1
timeout = "2m"
attempt_lease = "5m"
max_attempts = 2
max_parallel_cases = 2
max_parallel_variants = 2
allow_upstream_variation = false

[[variants]]
name = "chunk-small"
[variants.overrides]
CHUNK_SIZE = "512"

[[variants]]
name = "chunk-large"
[variants.overrides]
CHUNK_SIZE = "1024"

[[variants]]
name = "metrics-baseline"
[variants.overrides]
EXTRACT_METRIC_CANDIDATES_PROMPT = "extract-metrics-v1"
EXTRACT_METRIC_CANDIDATES_MODEL_NAME = "baseline"

[[variants]]
name = "metrics-alt"
[variants.overrides]
EXTRACT_METRIC_CANDIDATES_PROMPT = "extract-metrics-v1-alt"
EXTRACT_METRIC_CANDIDATES_MODEL_NAME = "baseline"
