# config.toml
app_name = "DeepDoc"
debug = true

[server]
port = 8080
host = "localhost"

[database]
create_mysql = false
create_pg = true
pg_host = "127.0.0.1"
pg_port = 5432
mysql_host = "192.168.0.20"
mysql_port = 3306
max_connections = 10
database_type = "pg"
need_create_tables = true

[app_table_names]
table_name_documents        = "documents"
table_name_process_status   = "process_status"
table_name_schedules        = "schedules"

[auth]
jwt_secret = "super-secret-key"
session_duration_hours = 24

[migration]
# MigrationsFS is the filesystem that contains the .sql migration files.
# Defaults to os.DirFS("migrations") when nil.
# Can also be fs.Sub(embedFS, "migrations") for an embedded filesystem.
# Path is relative to where the command is run (project root).
migrations_fs = "server/migrations"

# TableName overrides the version-tracking table name.
# Default: "goose_db_version"
tablename = "db_migrations"

# Verbose enables verbose output from the goose library.
# Default: true
verbose = "true"

# AllowOutOfOrder permits applying migrations whose version is lower
# than the current database version. Useful with feature branches.
# Default: true
allow_outof_order = "true"

# MigrationsDir is the directory on disk where migration files are stored.
# This is used for creating new migration files and ensuring the directory exists.
# Path is relative to where the command is run (project root).
migrations_dir = "server/migrations"