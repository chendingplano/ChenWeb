# config.toml
[app_info]
app_name = "DeepDoc"
debug = true
port = 8080
host = "localhost"
database_type = "pg"
need_create_tables = true

[mysql]
create = false
host = "127.0.0.1"
port = 3306
max_connections = 10

[postgres]
create = true
host = "127.0.0.1"
port = 5432
max_connections = 10

[app_table_names]
table_name_documents        = "documents"
table_name_process_status   = "process_status"
table_name_schedules        = "schedules"
table_name_flows            = "flows"
table_name_dspy_prompts         = "dspy_prompts"
table_name_cust_request_logs    = "cust_request_logs"

[auth]
jwt_secret = "super-secret-key"
session_duration_hours = 24

[llm]
workspace_timezone = "America/Chicago"
usage_retention_days = 30
archive_root = "/Users/cding/Apps/llm-logs"
reconciliation_run_hour = 2

[migration]
verbose 					= "true"
allow_outof_order 			= "true"

[pdf_parser]
enabled = true
staging_dir = "Data/kb/staging"
repo_dirs = ["Data/kb/repo-1", "Data/kb/repo-2"]
backup_dir = "Data/kb/backup"
poll_interval_seconds = 10
batch_size = 25
python_bin = "/Users/cding/Workspace/ThirdParty/paddleocr/.venv/bin/python"
paddleocr_script = "/Users/cding/Workspace/ThirdParty/paddleocr/parse_pdf.py"
use_paddleocr_vl = false
delete_from_staging = true
work_dir = "/Users/cding/Workspace/ChenWeb/Data/kb/.cache"

[doc-processing]
remove_toc_in_blocks = true
prev_overlapped_pages_in_blocks = 1
next_overlapped_pages_in_blocks = 1
required_processors = [
	"extract_metrics", 
	"extract_provisions", 
	"extract_semantic_projections",
	"extract_entity",
	"extract_relation",
	"generate_topics",
	"generate_summaries",
	"generate_scene_blocks",
	"extract_inventory_items"]

[artifacts]
artifact_graph_page_size = 30

[artifact_search]
dictionary = "simple"
default_page_size = 20
max_page_size = 100
preview_max_words = 18
phrase_friendly = true
min_rank = 0.0

[metric_search_weights]
metric_name = 1.8
metric_subject = 1.5
metric_keywords = 2.8
metric_desc = 1.0
metric_context = 0.8
value_class = 0.7
metric_unit = 0.5
table_name_or_section = 0.4
category_paths = 0.6

[semantic_projections_search_weights]
descriptive_name = 1.8
keywords = 2.4
semantic_projection = 1.0
category_paths = 0.6

[inventory_items_search_weights]
item_name = 2.0
canonical_name = 1.8
item_categories = 2.2
manufacturer = 0.8
brand = 1.0
model_number = 1.3
part_number = 1.3
aliases = 1.2
standards = 0.8
normalized_specs = 0.7
dedupe_key = 0.5
confidence_reason = 0.4

[scene_blocks_search_weights]
title = 1.8
scene_type = 1.2
summary = 1.0
keywords = 2.2

[provisions_search_weights]
provision_name = 1.8
provision_type = 1.2
provision_desc = 1.0
keywords = 2.2
category_paths = 0.6

[summaries_search_weights]
summary_text = 1.8
keywords = 2.2
category_paths = 0.8

[topics_search_weights]
topic_type = 1.2
topic_desc = 1.8
keywords = 2.2
category_paths = 0.8

[entities_search_weights]
entity = 1.8
entity_type = 1.2
aliases = 1.2
desc_text = 1.0
keywords = 2.2

[relations_search_weights]
subject = 1.6
predicate = 1.6
object = 1.6
desc_text = 1.0
keywords = 2.0

[frontend]
topic_types = ["封面/cover", "事实/fact", "范围/scope", "条款/compliance", "章节/heading", "过程/procedure", "表格/table", "需求/requirement", "公式/formula", "列表/list"]
supported_languages = ["en", "zh", "ja", "ko"]
default_language = ["zh"]
