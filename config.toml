# config.toml
[app_info]
app_name = "DeepDoc"
debug = true
port = 8080
host = "localhost"
database_type = "pg"
need_create_tables = true

[mysql]
create = false
host = "127.0.0.1"
port = 3306
max_connections = 10

[postgres]
create = true
host = "127.0.0.1"
port = 5432
max_connections = 10

[app_table_names]
table_name_documents        = "documents"
table_name_process_status   = "process_status"
table_name_schedules        = "schedules"
table_name_flows            = "flows"
table_name_dspy_prompts         = "dspy_prompts"
table_name_cust_request_logs    = "cust_request_logs"

[auth]
jwt_secret = "super-secret-key"
session_duration_hours = 24

[migration]
verbose 					= "true"
allow_outof_order 			= "true"

[pdf_parser]
enabled = true
staging_dir = "Data/kb/staging"
repo_dirs = ["Data/kb/repo-1", "Data/kb/repo-2"]
backup_dir = "Data/kb/backup"
poll_interval_seconds = 10
batch_size = 25
python_bin = "/Users/cding/Workspace/ThirdParty/paddleocr/.venv/bin/python"
paddleocr_script = "/Users/cding/Workspace/ThirdParty/paddleocr/parse_pdf.py"
use_paddleocr_vl = false
delete_from_staging = true
work_dir = "/Users/cding/Workspace/ChenWeb/Data/kb/.cache"
