# Document Review configuration (global, loaded once at startup).
#
# Two sections:
#   [packages.P1..P6]      — group-level defaults (model, max_tool_turns, enabled)
#   [reviewers.<aspect>]   — per-aspect overrides (DR3). An aspect inherits its
#                            group's package defaults; any field set here wins.
#
# Notes / current limitations:
#   * This is a GLOBAL config, not per-review-run (per-run TOML is out of scope).
#   * reference_docs is out of scope and intentionally omitted.
#   * Only `grammar_spelling` is wired into execution today (Phase I); the other
#     reviewer blocks are forward-looking config for when their reviewers land.
#
# i18n: package and reviewer labels are internationalized via `name_<locale>` /
#   `desc_<locale>` fields. `name_en`/`desc_en` are the default (fallback); add
#   `name_zh_cn`, etc. for other UI locales. The server resolves these per the
#   `?lang=` locale on GET /doc-review/aspects, falling back to the *_en value.

# ── Group (package) defaults ─────────────────────────────────────────────────

# Built-in defaults are [100, 200, 300]; these lower values are deliberate
# local testing overrides.
max_findings = [10, 20, 30]
max_analyses = [10, 20, 30]

[doc-reviever]
max_artifacts_passed_to_llm = 10

[packages.P5]
enabled = true
name_en = "Technical & Compliance Standards"
name_zh_cn = "技术与合规"
desc_en = "regulations"
desc_zh_cn = "法规与合规标准"
strategy = "per-chunk"
model = "deepseek-flash-chen"
max_tool_turns = 12

[packages.P4]
enabled = true
name_en = "Consistency"
name_zh_cn = "一致性"
desc_en = "Cross-document coherence"
desc_zh_cn = "跨文档一致性"
strategy = "document-level"
model = "deepseek-flash-chen"
max_tool_turns = 0

[packages.P3]
enabled = true
name_en = "Content Quality"
name_zh_cn = "内容质量"
desc_en = "Depth and correctness of content"
desc_zh_cn = "内容的深度与正确性"
strategy = "per-chunk"
model = "deepseek-flash-chen"
max_tool_turns = 0

[packages.P2]
enabled = true
name_en = "Structure & Organization"
name_zh_cn = "结构与组织"
desc_en = "Document architecture"
desc_zh_cn = "文档架构"
strategy = "document"
model = "deepseek-flash-chen"
max_tool_turns = 0

[packages.P1]
enabled = true
name_en = "Language & Style"
name_zh_cn = "语言与文风"
desc_en = "Surface-level writing quality"
desc_zh_cn = "表层写作质量"
strategy = "document-level"
model = "deepseek-flash-chen"
max_tool_turns = 0

[packages.P6]
