# P5 — Technical & Compliance
# metrics/provisions/entities/inventory_items are artifact-based, cross-document
# reviewers (ADRs 2026063002/03/04/05): they compare the document's extracted
# artifacts against semantically-related artifacts in OTHER documents, rather
# than reading the document text linearly.
#
# NOTE (ADR 2026070201 AR1): buildReviewers hardcodes Input="artifact" for these
# four aspects, and a non-empty ReviewerConfig.Input takes precedence over the
# `input` field here — the scheduler only consults this file when the code
# leaves Input empty. The values below are kept truthful so readers are not
# misled, but changing them alone does NOT change the execution path.
#
# Per ADR 2026070201 AR2-AR4, metrics/provisions/inventory_items send the
# canonical source window as a cacheable prefix, use prompt v2, and run a small
# tool-use budget for verifying screened candidates via get_artifact_context
# (a cross-record, read-only tool that must be listed explicitly in `tools`).
# entities is out of scope for that ADR and stays one-shot on prompt v1.
[reviewers.metrics]
name_en = "Metric Consistency"
name_zh_cn = "指标一致性"
desc_en = "Cross-document check: flags conflicting metric values, units, or thresholds against related metrics in other documents."
desc_zh_cn = "跨文档检查：将指标的数值、单位或阈值与其他文档中的相关指标比对，标记冲突。"
enabled = true
checked = true
group = "P5"
input = "artifact"
model = "deepseek-flash-chen"
prompt = "prompt-review-metrics-v6.md"
max_tool_turns = 4
max_tool_tokens = 24000
tools = ["get_artifact_context", "get_document_metadata"]

# metrics_completeness — object-anchored missing-metric detection
# (ADR 2026070201 AR6, Stage 5). Runs as a separate pass on the metrics
# reviewer's P5 group, comparing the doc's object→metric set against what
# peer documents attach to the same canonical objects. Tool-use is mandatory
# (search_metrics for the absence-verification step, get_artifact_context
# for context on screened candidates).
[reviewers.metrics_completeness]
name_en = "Missing Metric Detection"
name_zh_cn = "缺失指标检测"
desc_en = "Object-anchored check: flags metrics that peer documents attach to the same objects but are absent here."
desc_zh_cn = "以对象为锚的检查：标记同类文档为相同对象记录、但本文档缺失的指标。"
enabled = true
checked = true
group = "P5"
input = "artifact"
model = "deepseek-flash-chen"
prompt = "prompt-review-metrics-missing-v1.md"
max_tool_turns = 4
max_tool_tokens = 32000
tools = ["search_metrics", "get_artifact_context"]

[reviewers.provisions]
name_en = "Provision Consistency"
name_zh_cn = "条款一致性"
desc_en = "Cross-document check: flags contradictory or conflicting provisions (requirements, prohibitions) against related provisions in other documents."
desc_zh_cn = "跨文档检查：将条款（要求、禁止性规定）与其他文档中的相关条款比对，标记矛盾或冲突。"
