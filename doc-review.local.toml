# Document Review configuration (global, loaded once at startup).
#
# Two sections:
#   [packages.P1..P6]      — group-level defaults (model, max_tool_turns, enabled)
#   [reviewers.<aspect>]   — per-aspect overrides (DR3). An aspect inherits its
#                            group's package defaults; any field set here wins.
#
# Notes / current limitations:
#   * This is a GLOBAL config, not per-review-run (per-run TOML is out of scope).
#   * reference_docs is out of scope and intentionally omitted.
#   * Only `grammar_spelling` is wired into execution today (Phase I); the other
#     reviewer blocks are forward-looking config for when their reviewers land.

# ── Group (package) defaults ─────────────────────────────────────────────────

[packages.P5]
enabled = true
name = "Technical & Compliance Standards"
desc = "regulations"
strategy = "per-chunk"
model = "deepseek-flash-chen"
max_tool_turns = 12

[packages.P4]
enabled = true
name = "Consistency"
desc = "Cross-document coherence"
strategy = "document-level"
model = "deepseek-flash-chen"
max_tool_turns = 0

[packages.P3]
enabled = true
name = "Content Quality"
desc = "Depth and correctness of content"
strategy = "per-chunk"
model = "deepseek-flash-chen"
max_tool_turns = 0

[packages.P2]
enabled = true
name = "Structure & Organization"
desc = "Document architecture"
strategy = "document"
model = "deepseek-flash-chen"
max_tool_turns = 0

[packages.P1]
enabled = true
name = "Language & Style"
desc = "Surface-level writing quality"
strategy = "document-level"
model = "deepseek-flash-chen"
max_tool_turns = 0

[packages.P6]
enabled = true
name = "Meta & Process"
desc = "Document housekeeping"
strategy = "document-level"
model = "deepseek-flash-chen"
max_tool_turns = 0


