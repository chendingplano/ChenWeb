[tools]
bun = "latest"
caddy = "2.11.4"
go = "1.25.7"
node = "latest"


[tasks.update]
run = "cd web && bun install"

[tasks.build-server]
run = "go build -buildvcs=false -o ./.cache/server.exe ./server/cmd/deepdoc/."

[tasks.build-pdf-parser]
run = "go build -buildvcs=false -o ./.cache/pdf-parser.exe ./server/cmd/pdf-parser/."

[tasks.build-autotester]
run = "go build -buildvcs=false -o ./.cache/autotester.exe ./server/cmd/autotester/."

[tasks.build-doc-processor]
run = "go build -buildvcs=false -o ./.cache/doc-processor.exe ./server/cmd/doc-processor/."

[tasks.build-web]
run = '''
cd web && bun run build && cd ..
rsync -av --delete ./web/build/ ./server/api/webbuild/
'''

[tasks.dev]
run = '''
./web/node_modules/.bin/concurrently \
  --names "API,WEB" \
  --prefix-colors "bgBlue.bold,bgMagenta.bold" \
  'mise dev-server' \
  'mise dev-web'
'''

[tasks.dev-server]
run = 'go tool air'

[tasks.dev-web]
run = "cd web && bun run dev"

[tasks.dev-agent-gateway]
description = "Run the private Pi gateway for the ChenWeb agent-services pilot."
run = 'cd "${PI_GATEWAY_DIR:?set PI_GATEWAY_DIR to ThirdParty/pi}" && bun run gateway'

[tasks.dev-agent-services]
description = "Start ChenWeb API, web UI, and the loopback-only Pi gateway together."
run = '''
./web/node_modules/.bin/concurrently \
  --names "API,WEB,PI" \
  --prefix-colors "bgBlue.bold,bgMagenta.bold,bgGreen.bold" \
  'mise dev-server' \
  'mise dev-web' \
  'mise dev-agent-gateway'
'''

[tasks.docker-start]
run = "colima start"

[tasks.docker-stop]
run = "colima stop"

[tasks.docker-status]
run = "colima status"

[tasks.obs-up]
run = "docker compose -f observability/docker-compose.yml up -d"

[tasks.obs-down]
run = "docker compose -f observability/docker-compose.yml down"

[tasks.obs-logs]
run = "docker compose -f observability/docker-compose.yml logs -f"

[tasks.obs-ui]
run = "printf 'HyperDX UI: http://localhost:8088\\nOTLP HTTP: http://localhost:14318\\nOTLP gRPC: localhost:14317\\n'"

[tasks.publish]
run = '''
mise build-web
KO_DOCKER_REPO=dinglind/mirai go tool ko build ./server/cmd/mirai --platform=linux/amd64 --bare --sbom=none
'''

[tasks.typegen]
run = "bunx pocketbase-typegen --db ./pb_data/data.db -o web/src/lib/pocketbase-types.ts"

[tasks.build-both]
run = "mise build-web && mise build-server"

[tasks.build-server-linux]
description = "Cross-build ChenWeb linux/amd64 binaries + sha256 + migration files + prompts/ + *.local.toml reviewer configs + config.toml/config//docs/doc-templates into /tmp/chenweb-deploy for the China box (onto.bzton.cn). BINS=server,doc-processor subsets; default builds all five."
run = '''
set -euo pipefail

OUT=/tmp/chenweb-deploy
REPO="$(git rev-parse --show-toplevel)"
cd "$REPO"

# binary name -> cmd package
ALL="server:./server/cmd/deepdoc doc-processor:./server/cmd/doc-processor parser-result-converter:./server/cmd/parser-result-converter doc-service:./server/cmd/doc-service create-admin:./server/cmd/create-admin"
SELECT="${BINS:-}"   # e.g. BINS="server,doc-processor"

SELECTED=""
for pair in $ALL; do
  name="${pair%%:*}"
  if [ -z "$SELECT" ] || printf '%s' ",$SELECT," | grep -q ",$name,"; then
    SELECTED="$SELECTED $pair"
  fi
done
[ -n "$SELECTED" ] || { echo "BINS=$SELECT selected nothing; valid: server,doc-processor,parser-result-converter,doc-service,create-admin" >&2; exit 1; }

rm -rf "$OUT"
mkdir -p "$OUT"

# Only the 'server' (deepdoc) binary embeds the frontend (server/api/routes.go
# //go:embed all:webbuild). Rebuild it so login-01.svelte's phone UI is current
# -- the committed server/api/webbuild is stale.
case " $SELECTED " in
  *" server:"*)
    echo "==> rebuilding embedded frontend"
    ( cd web && bun run build )
    rsync -a --delete ./web/build/ ./server/api/webbuild/
    ;;
esac

built=""
for pair in $SELECTED; do
  name="${pair%%:*}"; pkg="${pair##*:}"
  echo "==> building $name-linux  ($pkg)"
  CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
    go build -trimpath -buildvcs=false -ldflags "-s -w" \
    -o "$OUT/$name-linux" "$pkg"
  ( cd "$OUT" && shasum -a 256 "$name-linux" > "$name-linux.sha256" )
  built="$built $name-linux"
done

# self-contained: ship the on-box deploy script alongside the binaries
cp "$REPO/scripts/deploy-server-china.sh" "$OUT/"
chmod +x "$OUT/deploy-server-china.sh"

# Ship the migration files too. config.RunMigrations reads these from DISK at
# service startup (sharedgoose -> os.DirFS on PROJECT_MIGRATION_DIR), not from a
# go:embed FS, so a binaries-only payload leaves the box's schema frozen wherever
# the last copy left it -- goose then applies nothing and tables silently go
# missing. Always shipped regardless of BINS: migrations are not per-binary.
mig_counts=""
for d in project_migrations shared_migrations; do
  if [ -d "$REPO/$d" ]; then
    mkdir -p "$OUT/$d"
    cp -a "$REPO/$d"/. "$OUT/$d"/
    c=$(ls -1 "$OUT/$d"/*.sql 2>/dev/null | wc -l | tr -d " ")
    echo "==> staged $d ($c files)"
    mig_counts="$mig_counts $d=$c"
  else
    echo "==> WARNING: $REPO/$d not found -- no migrations staged for it" >&2
  fi
done

# Ship the prompts/ directory too. PROMPT_DIR (or the ./prompts fallback) is
# read from disk per-call (doc-structure-analyzer.go, extract-doc-metadata.go,
# extract-metrics.go, etc.), not go:embed'd, so a binaries-only payload leaves
# the box's prompts frozen wherever the last hand-rsync left them -- this bit
# onto.bzton.cn for real (2026-09-22: box was missing/stale on product-mention
# and product-extraction prompts after a rename on the Mac went undeployed).
# Always shipped regardless of BINS: prompts are not per-binary.
if [ -d "$REPO/prompts" ]; then
  mkdir -p "$OUT/prompts"
  cp -a "$REPO/prompts"/. "$OUT/prompts"/
  prompt_count=$(ls -1 "$OUT/prompts" | wc -l | tr -d " ")
  echo "==> staged prompts ($prompt_count files)"
else
  echo "==> WARNING: $REPO/prompts not found -- no prompts staged" >&2
  prompt_count=0
fi

# Ship the *.local.toml reviewer configs too. Despite the ".local." name these
# are git-tracked repo-root files (not gitignored machine overrides, unlike
# mise.local.toml/config.local.toml) that GetDocReviewConfig()/
# productreviews.GetConfig() read from disk on demand -- not go:embed'd, so
# they're invisible to a binaries-only payload just like prompts/ was (see the
# deploy runbook's Gotcha section). Missing doc-review.local.toml silently
# disables 6 reviewer aspects; missing product-review.local.toml fails every
# Product Review build request outright. Both have already been hit for real
# on onto.bzton.cn (2026-09-16). Always shipped regardless of BINS.
cfg_files=""
for f in doc-review.local.toml product-review.local.toml; do
  if [ -f "$REPO/$f" ]; then
    cp "$REPO/$f" "$OUT/$f"
    cfg_files="$cfg_files $f"
  else
    echo "==> WARNING: $REPO/$f not found -- not staged" >&2
  fi
done
[ -n "$cfg_files" ] && echo "==> staged reviewer configs:$cfg_files"

# Ship config.toml + the config/ tree too. config.LoadConfig reads config.toml
# from disk at every startup (not go:embed'd), and /api/site-config's
# LoadSiteConfig reads config/site/*.toml the same way -- see the deploy
# runbook §2.3. config.toml specifically drifted on onto.bzton.cn for real
# (2026-09-23): the box's copy predated the 2026-09-17 commit that moved
# [doc-processing] required_processors out of config.toml into
# config.local.toml-only, so the box's stale copy kept winning over every
# config.local.toml edit no matter how many times doc-processor was restarted
# (see devdoc 2026092301-devdoc-doc-processor-config-drift.md). Always shipped
# regardless of BINS: this is app config, not per-binary.
if [ -f "$REPO/config.toml" ]; then
  cp "$REPO/config.toml" "$OUT/config.toml"
  echo "==> staged config.toml"
else
  echo "==> WARNING: $REPO/config.toml not found -- not staged" >&2
fi

if [ -d "$REPO/config" ]; then
  mkdir -p "$OUT/config"
  cp -a "$REPO/config"/. "$OUT/config"/
  config_count=$(find "$OUT/config" -type f | wc -l | tr -d " ")
  echo "==> staged config/ ($config_count files)"
else
  echo "==> WARNING: $REPO/config not found -- no config/ staged" >&2
  config_count=0
fi

# docs/doc-templates/*.typ are read from disk by the typst report renderer
# (server/api/doc-reviews/typst_report.go, correction_report.go), not
# go:embed'd. Always shipped regardless of BINS.
if [ -d "$REPO/docs/doc-templates" ]; then
  mkdir -p "$OUT/docs/doc-templates"
  cp -a "$REPO/docs/doc-templates"/. "$OUT/docs/doc-templates"/
  echo "==> staged docs/doc-templates"
else
  echo "==> WARNING: $REPO/docs/doc-templates not found -- not staged" >&2
fi

{
  echo "git_rev:   $(git rev-parse HEAD)"
  echo "git_short: $(git rev-parse --short HEAD)"
  echo "git_dirty: $([ -n "$(git status --porcelain)" ] && echo yes || echo no)"
  echo "built_at:  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
  echo "built_on:  $(hostname)"
  echo "binaries: $built"
  echo "migrations:$mig_counts"
  echo "prompts: $prompt_count files"
  echo "reviewer_configs:${cfg_files:- <none staged>}"
  echo "config: config.toml + config/ ($config_count files) + docs/doc-templates"
} > "$OUT/MANIFEST"

echo
echo "=== $OUT ==="
ls -lh "$OUT"
echo
cat "$OUT"/*.sha256
echo
echo "next:"
echo "  scp -P 8822 -r $OUT gui@210.5.158.91:~/"
echo "  ssh -p 8822 gui@210.5.158.91   # then:  bash ~/chenweb-deploy/deploy-server-china.sh ~/chenweb-deploy  (no su needed -- gui has a scoped sudoers rule for systemctl)"
'''

[tasks.serve]
run = '''USE_EMBED_FRONTEND=true ./.cache/server.exe serve --dir '''

[tasks.run-all-tests]
run = "go run ./server/cmd/autotester/"


[tasks.pdf-parser-once]
run = "go run ./server/cmd/pdf-parser/ --once"

[tasks.llm-usage-report]
run = "go run ./server/cmd/llm-usage-report/"

[tasks.pdf-parser-migrate]
run = "go run ./server/cmd/pdf-parser/ --migrate-only"

[tasks.pdf-parser-verify-schema]
run = "go run ./server/cmd/pdf-parser/ --verify-schema-only"

[tasks.pdf-parser-start]
run = '''
mkdir -p ./.cache
if [ -f ./.cache/pdf-parser.pid ] && kill -0 "$(cat ./.cache/pdf-parser.pid)" 2>/dev/null; then
  echo "pdf-parser already running (pid $(cat ./.cache/pdf-parser.pid))"
  exit 0
fi
nohup go run ./server/cmd/pdf-parser/ > ./.cache/pdf-parser.log 2>&1 &
echo $! > ./.cache/pdf-parser.pid
echo "pdf-parser (staging) started (pid $(cat ./.cache/pdf-parser.pid))"
'''

[tasks.pdf-parser-stop]
run = '''
if [ ! -f ./.cache/pdf-parser.pid ]; then
  echo "pdf-parser is not running (no pid file)"
  exit 0
fi
PID="$(cat ./.cache/pdf-parser.pid)"
if kill -0 "$PID" 2>/dev/null; then
  kill "$PID"
  echo "stopped pdf-parser (pid $PID)"
else
  echo "stale pid file found for pid $PID"
fi
rm -f ./.cache/pdf-parser.pid
'''

[tasks.pdf-parser-status]
run = '''
if [ ! -f ./.cache/pdf-parser.pid ]; then
  echo "pdf-parser not running"
  exit 1
fi
PID="$(cat ./.cache/pdf-parser.pid)"
if kill -0 "$PID" 2>/dev/null; then
  echo "pdf-parser running (pid $PID)"
  exit 0
fi
echo "pdf-parser not running (stale pid $PID)"
exit 1
'''

[tasks.ocr-service-start]
run = '''
mkdir -p ./.cache
if [ -f ./.cache/ocr-service.pid ] && kill -0 "$(cat ./.cache/ocr-service.pid)" 2>/dev/null; then
  echo "ocr-service already running (pid $(cat ./.cache/ocr-service.pid))"
  exit 0
fi
VENV=/Users/cding/Workspace/ThirdParty/paddleocr/.venv
export VIRTUAL_ENV="$VENV"
export PYTHONPATH=""
unset PYTHONHOME
nohup "$VENV/bin/python" /Users/cding/Workspace/ThirdParty/paddleocr/pdf_parser_service.py \
  > ./.cache/ocr-service.log 2>&1 &
echo $! > ./.cache/ocr-service.pid
echo "ocr-service started (pid $(cat ./.cache/ocr-service.pid))"
'''
[tasks.ocr-service-start-sync]
run = '''
mkdir -p ./.cache
if [ -f ./.cache/ocr-service.pid ] && kill -0 "$(cat ./.cache/ocr-service.pid)" 2>/dev/null; then
  echo "ocr-service already running (pid $(cat ./.cache/ocr-service.pid))"
  exit 0
fi
VENV=/Users/cding/Workspace/ThirdParty/paddleocr/.venv
export VIRTUAL_ENV="$VENV"
export PYTHONPATH=""
unset PYTHONHOME
"$VENV/bin/python" /Users/cding/Workspace/ThirdParty/paddleocr/pdf_parser_service.py
'''

[tasks.ocr-service-kill]
description = "Stop ocr-service started in sync (foreground) mode by script name"
run = '''
if pkill -SIGTERM -f "pdf_parser_service.py"; then
  echo "ocr-service terminated"
else
  echo "ocr-service was not running"
fi
'''

[tasks.ocr-service-stop]
run = '''
if [ ! -f ./.cache/ocr-service.pid ]; then
  echo "ocr-service is not running"
  exit 0
fi
PID="$(cat ./.cache/ocr-service.pid)"
if kill -0 "$PID" 2>/dev/null; then
  kill "$PID" && echo "stopped ocr-service (pid $PID)"
else
  echo "stale pid file for pid $PID"
fi
rm -f ./.cache/ocr-service.pid
'''

[tasks.ocr-service-status]
run = '''
if [ ! -f ./.cache/ocr-service.pid ]; then
  echo "ocr-service not running"
  exit 1
fi
PID="$(cat ./.cache/ocr-service.pid)"
if kill -0 "$PID" 2>/dev/null; then
  echo "ocr-service running (pid $PID)"
  exit 0
fi
echo "ocr-service not running (stale pid $PID)"
exit 1
'''

[tasks.pdf-parser-run]
run = "go run ./server/cmd/pdf-parser/"

[tasks.apply-nix]
run = "cd ~/Workspace/nix && sudo darwin-rebuild switch --flake ."

# --- Gold corpus benchmark (benchmark/doc-processors/gold) ---
# Always runs against the isolated chenweb_test DB and ThirdParty-2/Data
# artifact dirs, never the production DB/artifacts (ADR 2026072901 P3). These
# are hardcoded (not `${VAR:-default}`) because mise.local.toml already
# exports PG_DB_NAME/ARTIFACT_DIR/ARTIFACT_WEB_DIR for production use, so a
# fallback-if-unset pattern would silently inherit the production values
# instead of overriding them.

[tasks.gold-benchmark-run]
description = '''
Run the gold ventilator-display-module corpus through ONE real doc processor.
Usage: PROCESSOR=extract_metrics mise run gold-benchmark-run
Optional: DATASET_ROOT/CASE_ID to point at a different corpus case as more
documents/cases are added; extra args (e.g. --document, --dry-run) pass
through after --.
'''
run = '''
set -euo pipefail
: "${PROCESSOR:?set PROCESSOR to a doc processor name, or PROCESSOR=all, e.g. PROCESSOR=extract_metrics}"
export PG_DB_NAME=chenweb_test
export ARTIFACT_DIR=/Users/cding/Workspace/ThirdParty-2/Data/Artifacts
export ARTIFACT_WEB_DIR=/Users/cding/Workspace/ThirdParty-2/Data/ArtifactWeb
export JIMO_LOG_STDIO=0
DATASET_ROOT="${DATASET_ROOT:-benchmark/doc-processors/gold/display-module-v1}"
CASE_ID="${CASE_ID:-display-module-v1}"
go run ./server/cmd/doc-benchmark gold-run \
  --dataset "$DATASET_ROOT" \
  --case "$CASE_ID" \
  --artifact-root "$ARTIFACT_DIR" \
  --artifact-web-root "$ARTIFACT_WEB_DIR" \
  --processors "$PROCESSOR" \
  "$@"
'''

[tasks.gold-benchmark-run-all]
description = '''
Run the gold ventilator-display-module corpus through EVERY known doc
processor in one pass (generate_summaries, generate_topics,
extract_doc_metadata, extract_semantic_projections,
extract_structured_knowledge, extract_entity, extract_relation,
extract_inventory_items, extract_metrics, extract_provisions,
generate_scene_blocks). Optional: DATASET_ROOT/CASE_ID; extra args pass
through after --.
'''
run = 'PROCESSOR=all mise run gold-benchmark-run -- "$@"'

[tasks.gold-benchmark-analyze]
description = '''
Ask an LLM to read a gold-benchmark-run's JSON output side by side with the
gold fixture's own source text and write a Markdown extraction-quality
report. Usage: RESULTS=/path/to/run.json mise run gold-benchmark-analyze
Optional: DATASET_ROOT/CASE_ID (must match the run that produced RESULTS),
OUTPUT (markdown file; stdout when unset).
'''
run = '''
set -euo pipefail
: "${RESULTS:?set RESULTS to a gold-benchmark-run JSON output file}"
export JIMO_LOG_STDIO=0
DATASET_ROOT="${DATASET_ROOT:-benchmark/doc-processors/gold/display-module-v1}"
CASE_ID="${CASE_ID:-display-module-v1}"
args=(--dataset "$DATASET_ROOT" --case "$CASE_ID" --results "$RESULTS")
if [ -n "${OUTPUT:-}" ]; then
  args+=(--output "$OUTPUT")
fi
go run ./server/cmd/doc-benchmark analyze "${args[@]}" "$@"
'''

[tasks.gold-benchmark-profile-report]
description = "Render a deterministic store-profile report from schema-v2 gold-run JSON."
run = '''
set -euo pipefail
: "${RESULTS:?set RESULTS to an absolute schema-v2 gold-run JSON path}"
export JIMO_LOG_STDIO=0
DATASET_ROOT="${DATASET_ROOT:-benchmark/doc-processors/gold/display-module-v1}"
CASE_ID="${CASE_ID:-display-module-v1}"
FORMAT="${FORMAT:-json}"
args=(profile-report --dataset "$DATASET_ROOT" --case "$CASE_ID" --results "$RESULTS" --format "$FORMAT")
if [ -n "${OUTPUT:-}" ]; then
  args+=(--output "$OUTPUT")
fi
go run ./server/cmd/doc-benchmark "${args[@]}" "$@"
'''

[tasks.semos-p0-benchmark-evidence]
description = "Run the isolated SemOS P0 store-profile evidence workflow."
run = '''
set -euo pipefail
: "${RESULTS:?set RESULTS to an absolute output JSON path}"
: "${REPORT:?set REPORT to an absolute report JSON path}"
export PG_DB_NAME=chenweb_test
export ARTIFACT_DIR=/Users/cding/Workspace/ThirdParty-2/Data/Artifacts
export ARTIFACT_WEB_DIR=/Users/cding/Workspace/ThirdParty-2/Data/ArtifactWeb
export JIMO_LOG_STDIO=0
DATASET_ROOT=benchmark/doc-processors/gold/display-module-v1
CASE_ID=display-module-v1
PROCESSORS=generate_summaries,generate_topics,extract_structured_knowledge,extract_entity,extract_relation,extract_inventory_items,extract_metrics,extract_provisions
go run ./server/cmd/doc-benchmark gold-run \
  --dataset "$DATASET_ROOT" \
  --case "$CASE_ID" \
  --artifact-root "$ARTIFACT_DIR" \
  --artifact-web-root "$ARTIFACT_WEB_DIR" \
  --processors "$PROCESSORS" > "$RESULTS"
RESULTS="$RESULTS" OUTPUT="$REPORT" FORMAT=json \
  mise run gold-benchmark-profile-report
'''

[tasks.ontology-compiler]
description = '''
Run the DB-native ontology module compiler against the database.
Usage: COMPILER_ARGS='release --module core --version 1.0.0' mise run ontology-compiler
Subcommands: validate --module <id> | release --module <id> --version <v> |
activate --module <id> --release-id <n> | rollback --module <id> --version <v> |
modules | active [--module <id>]
'''
run = '''
set -euo pipefail
: "${COMPILER_ARGS:?set COMPILER_ARGS, e.g. COMPILER_ARGS='release --module core --version 1.0.0'}"
export PG_DB_NAME=chenweb_test
go run ./server/cmd/ontology-compiler $COMPILER_ARGS
'''

[tasks.ontology-seed]
description = '''
Install the curated platform-owned ontology modules into the service database
and verify the result.
Usage: mise run ontology-seed              # all curated modules (default)
       MODULE=measurement mise run ontology-seed

Unlike `ontology-compiler`, this task never overrides PG_DB_NAME, so it targets
the real service database (miner) rather than chenweb_test. The seeder accepts
PG_USER_NAME (then PG_USER, then the literal fallback `cding`); the psql
verification uses that same user resolution.

`ontology-seed` exits nonzero when authoring or releasing fails. This task also
verifies the result against the runtime gate: any `included_in_release` version
of each module's terms, matching what `associate_semantics`' termExists checks,
not the activation pointer. See bug doc-2026081301.
'''
run = '''
set -euo pipefail
: "${PG_DB_NAME:?set PG_DB_NAME (mise.local.toml sets it to the service database)}"
: "${PG_PASSWORD:?set PG_PASSWORD}"
trim_whitespace() {
  printf '%s' "$1" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'
}
POSTGRES_USER="$(trim_whitespace "${PG_USER_NAME:-}")"
if [ -z "$POSTGRES_USER" ]; then
  POSTGRES_USER="$(trim_whitespace "${PG_USER:-}")"
fi
if [ -z "$POSTGRES_USER" ]; then
  POSTGRES_USER=cding
fi

MODULE="${MODULE:-all}"
if [ "$MODULE" = "all" ]; then
  MODULES="core document-authority measurement"
else
  MODULES="$MODULE"
fi

echo "==> seeding curated ontology modules [$MODULES] into database '$PG_DB_NAME'"

PGPASSWORD="$PG_PASSWORD" go run ./server/cmd/ontology-seed --module "$MODULE"

echo "==> verifying released vocabulary in '$PG_DB_NAME'"

psql_q() {
  PGPASSWORD="$PG_PASSWORD" psql -h "${PG_HOST:-/tmp}" -p "${PG_PORT:-5432}" \
    -U "$POSTGRES_USER" -d "$PG_DB_NAME" -tAc "$1"
}

failed=0
for m in $MODULES; do
  version=$(psql_q "SELECT version FROM kb.ontology_module_releases WHERE module_id = '$m' ORDER BY released_at DESC, id DESC LIMIT 1")
  if [ -z "$version" ]; then
    echo "  FAIL $m: no release exists"
    failed=1
    continue
  fi
  count=$(psql_q "SELECT count(*) FROM kb.ontology_terms WHERE module_id = '$m' AND status = 'included_in_release'")
  if [ "$count" -eq 0 ]; then
    echo "  FAIL $m: no included_in_release terms; the runtime termExists gate requires a released version"
    failed=1
    continue
  fi
  echo "  ok   $m newest release $version ($count released terms)"
done

# The terms associate_semantics gates on. A green module release with these
# missing is the exact production failure this task exists to prevent.
case " $MODULES " in
  *" measurement "*)
    for t in mea:measured_by mea:lower_bound_requirement; do
      released=$(psql_q "SELECT count(*) FROM kb.ontology_terms WHERE term_id = '$t' AND status = 'included_in_release'")
      if [ "$released" -eq 0 ]; then
        echo "  FAIL $t: no included_in_release version, associate_semantics requires a released term"
        failed=1
      else
        echo "  ok   $t included_in_release"
      fi
    done
    ;;
esac

if [ "$failed" -ne 0 ]; then
  echo "==> ontology seed verification FAILED against '$PG_DB_NAME'"
  exit 1
fi
echo "==> ontology seed verified against '$PG_DB_NAME'"
'''
